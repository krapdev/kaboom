      ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * rx, y + Math.sin(a) * ry); ctx.lineTo(x + Math.cos(a) * (rx + l), y + Math.sin(a) * (ry + l * 0.7));
      ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 2.5; ctx.strokeStyle = top; ctx.stroke();

// Petite secousse de l'écran (explosion proche, ou quand on est touché)
let shakeUntil = 0, shakeAmp = 0;

}
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
/* ---------- Joystick tactile (en bas à gauche, coordonnées écran) ---------- */

// Style « pouce » : grand disque fixe très transparent (la zone du pad),
// point central fixe, et un gros cercle plein qui suit le pouce.
// La direction va du point central vers le gros cercle.
const joy = {
  enabled: (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window),
  cx: 0, cy: 0,      // centre fixe du pad
  baseR: 70,         // rayon du grand disque fixe transparent
  r: 36,             // rayon du gros cercle plein qui suit le pouce
  knobR: 15,         // rayon du point central fixe
  travel: 60,        // distance maximale du gros cercle par rapport au centre
  pid: null,         // doigt qui pilote le pad
  kx: 0, ky: 0,      // décalage du gros cercle par rapport au centre (px)
  vx: 0, vy: 0       // direction de sortie, longueur 0..1
};
const JOY_DEAD = 0.08;              // petite zone morte au centre
const JOY_FULL = 0.75;              // pleine vitesse aux trois quarts de la course
const TAP_MS = 220, TAP_PX = 14;    // tap court et immobile dans la moitié gauche = bombe, pas joystick

function layoutJoystick() {
  joy.baseR = Math.max(55, Math.min(85, Math.min(W, H) * 0.17));
  joy.r = joy.baseR * 0.52;
  joy.knobR = joy.baseR * 0.22;
  joy.travel = joy.baseR * 0.85;     // le gros cercle peut déborder du disque, comme sur le modèle
  const margin = 24 + joy.baseR;     // au repos, le disque est entièrement visible
  joy.homeX = margin;                // position de repos (en bas à gauche)
  joy.homeY = H - margin;
  if (joy.pid === null) { joy.cx = joy.homeX; joy.cy = joy.homeY; }
}

// ---- Stick de visée (tactile, moitié droite) : on glisse pour viser, on lâche pour lancer.
// La distance du lancer suit l'écart du pouce. Pouce ramené au centre = annulé. Pas de visée automatique.
const aim = { pid: null, cx: 0, cy: 0, kx: 0, ky: 0, baseR: 70, travel: 60, homeX: 0, homeY: 0 };
const AIM_DEAD = 0.25;             // en dessous : rien ne part (annulation)
function layoutAim() {
  aim.baseR = joy.baseR; aim.travel = joy.baseR * 0.9;
  const margin = 24 + aim.baseR;
  aim.homeX = W - margin; aim.homeY = H - margin;
  if (aim.pid === null) { aim.cx = aim.homeX; aim.cy = aim.homeY; }
}
function aimStart(id, x, y) {
  aim.pid = id;
  const m = aim.baseR + 6;
  aim.cx = Math.max(m, Math.min(W - m, x)); aim.cy = Math.max(m, Math.min(H - m, y));
  aim.kx = aim.ky = 0;
}
function aimMove(x, y) {
  let dx = x - aim.cx, dy = y - aim.cy, d = Math.hypot(dx, dy);
  if (d > aim.travel) { const over = d - aim.travel; aim.cx += dx / d * over; aim.cy += dy / d * over; dx = x - aim.cx; dy = y - aim.cy; }
  aim.kx = dx; aim.ky = dy;
}
// point visé sur le terrain (null si le pouce est dans la zone d'annulation)
function aimTarget() {
  const d = Math.hypot(aim.kx, aim.ky), m = Math.min(1, d / aim.travel);
  if (aim.pid === null || m < AIM_DEAD) return null;
  const u = (m - AIM_DEAD) / (1 - AIM_DEAD), dist = rangeOf(me) * (0.15 + 0.85 * u);

}
function aimEnd(cancelled) {
  const t = cancelled ? null : aimTarget();
  aim.pid = null; aim.kx = aim.ky = 0; aim.cx = aim.homeX; aim.cy = aim.homeY;
  if (t) throwBomb(t.x, t.y);
}
function canThrowNow() {
  const now = performance.now();
  return !!myId && !(me.stunUntil > now) && !(me.dead && !me.ghost) && !waiting && !game.winner && !game.endResult && now >= goAt && now >= bombReadyAt;
}
// stick à l'écran (coordonnées écran)
function drawAimStick() {
  if (!joy.enabled || !myId || (me.dead && !me.ghost)) return;
  const active = aim.pid !== null, ready = canThrowNow();
  const { cx, cy, baseR } = aim, tx = cx + aim.kx, ty = cy + aim.ky;
  const m = Math.min(1, Math.hypot(aim.kx, aim.ky) / aim.travel), cancel = active && m < AIM_DEAD;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
  ctx.fillStyle = active ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.06)'; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = active ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.16)'; ctx.stroke();
  // zone d'annulation au centre
  ctx.beginPath(); ctx.arc(cx, cy, aim.travel * AIM_DEAD, 0, Math.PI * 2); ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.stroke(); ctx.setLineDash([]);
  // bouton qui suit le pouce : rouge si prêt, gris pendant la recharge ; une petite bombe dessus
  const r = joy.r;
  ctx.globalAlpha = active ? 1 : 0.8;
  ctx.beginPath(); ctx.arc(tx + 2, ty + 3, r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
  ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2); ctx.fillStyle = cancel ? '#8a8f9c' : (ready ? (me.ghost ? '#7be04a' : RED) : '#6b7080'); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  if (cancel) {   // croix : relâcher ici n'envoie rien
    const k = r * 0.32; ctx.beginPath(); ctx.moveTo(tx - k, ty - k); ctx.lineTo(tx + k, ty + k); ctx.moveTo(tx + k, ty - k); ctx.lineTo(tx - k, ty + k); ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
  } else fuseBomb(tx - r * 0.08, ty + r * 0.08, r * 0.42, performance.now(), false);
  ctx.restore();
}
// aperçu du lancer sur le terrain (coordonnées terrain) : trajectoire en cloche + zone d'impact
function drawAimPreview(now) {
  const t = aimTarget();
  if (!t || (me.dead && !me.ghost)) return;
  const ready = canThrowNow(), glue = !!me.ghost;
  const r = glue ? GLUE_R : BLAST_R * (me.mega ? MEGA_BLAST : 1) * (hurryOn(now) ? HURRY_BLAST : 1);
  const col = !ready ? 'rgba(80,85,100,.7)' : (glue ? '#3f9a2a' : '#d8321f');
  ctx.save(); ctx.lineCap = 'round';
  // trajectoire en pointillés qui défilent vers la cible
  const sx = me.x, sy = me.y - RADIUS * 0.3, d = Math.hypot(t.x - sx, t.y - sy), hgt = Math.min(110, 30 + d * 0.3);
  ctx.setLineDash([2, 13]); ctx.lineDashOffset = -now / 25; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo((sx + t.x) / 2, (sy + t.y) / 2 - hgt * 2, t.x, t.y); ctx.stroke();
  ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();
  // zone d'impact
  ctx.setLineDash([9, 7]); ctx.lineDashOffset = now / 40;
  ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
  ctx.fillStyle = !ready ? 'rgba(80,85,100,.12)' : (glue ? 'rgba(123,224,74,.2)' : 'rgba(255,90,60,.2)'); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
  ctx.restore();
}

function inField(x, y) {
  return x >= ox && x <= ox + WW * scale && y >= oy && y <= oy + WH * scale;
}
// Zone de prise du joystick : toute la moitié gauche de l'écran, bien plus grande que le dessin
function inJoyZone(x, y) { return x < W * 0.5; }
let mouseJoy = false;   // version de test : piloter le joystick à la souris

function setJoy(x, y) {
  let dx = x - joy.cx, dy = y - joy.cy;
  let d = Math.hypot(dx, dy);
  if (d > joy.travel) {
    // le pad suit le pouce : la base glisse pour garder le doigt au bout de la course
    const over = d - joy.travel;
    joy.cx += dx / d * over; joy.cy += dy / d * over;
    dx = x - joy.cx; dy = y - joy.cy; d = joy.travel;
  }
  joy.kx = dx; joy.ky = dy;
  if (joy.startX != null && Math.hypot(x - joy.startX, y - joy.startY) > TAP_PX) joy.moved = true;
  const m = d / joy.travel;
  if (m < JOY_DEAD) { joy.vx = 0; joy.vy = 0; return; }
  const sp = Math.min(1, (m - JOY_DEAD) / (JOY_FULL - JOY_DEAD));   // réponse franche
  joy.vx = dx / d * sp;
  joy.vy = dy / d * sp;
}

// Joystick flottant : le pad apparaît sous le pouce (sans sortir de l'écran)
function joyStart(id, x, y, resumed) {
  joy.enabled = true;
  joy.pid = id;
  const m = joy.baseR + 6;
  joy.cx = Math.max(m, Math.min(W - m, x));
  joy.cy = Math.max(m, Math.min(H - m, y));
  joy.startX = x; joy.startY = y;
  joy.startAt = performance.now();
  joy.moved = !!resumed;
  setJoy(x, y);
}

function releaseJoy() {
  joy.pid = null;
  joy.kx = joy.ky = joy.vx = joy.vy = 0;
  joy.startX = null;
  if (joy.homeX != null) { joy.cx = joy.homeX; joy.cy = joy.homeY; }   // le pad revient à sa place

function joyEnd(x, y, cancelled) {

function drawJoystick() {
  if (!joy.enabled) return;
  const { cx, cy, baseR, r, knobR, kx, ky } = joy;
  const active = joy.pid !== null;
  const tx = cx + kx, ty = cy + ky;          // centre du gros cercle (suit le pouce)

  // 1. Grand disque fixe, très transparent : le fond discret qui relie les éléments
  ctx.beginPath();
  ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
  ctx.fillStyle = active ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.06)';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = active ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.16)';
  ctx.stroke();

  // 2. Point central fixe, plus sombre
  ctx.beginPath();
  ctx.arc(cx, cy, knobR, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(70,78,98,0.85)';

  ctx.beginPath();
  ctx.arc(tx, ty, r, 0, Math.PI * 2);

  ctx.stroke();
  ctx.restore();
}

function update(dt) {
  const now = performance.now();
  // éliminé depuis 3 s : on revient en fantôme
  if (me.dead && !me.ghost && ghostAllowed() && now - (me.deadAt || now) >= GHOST_DELAY + FLING_MS) {
    me.ghost = true; bombCdTotal = 2000; bombReadyAt = now + 2000; sendState();
  }
  if (me.ghost && !ghostAllowed()) me.ghost = false;
  if ((!me.dead || me.ghost) && now >= goAt && !game.endResult) {
    let dx = 0, dy = 0;
    if (keys['arrowleft'] || keys['a'] || keys['q']) dx -= 1;
    if (keys['arrowright'] || keys['d']) dx += 1;
    if (keys['arrowup'] || keys['w'] || keys['z']) dy -= 1;
    if (keys['arrowdown'] || keys['s']) dy += 1;
    // joystick : vitesse selon l'inclinaison ; tant qu'il est au neutre, le clavier garde la main (sinon un clic bloquait le perso)
    if (joy.pid !== null && (joy.vx || joy.vy)) { dx = joy.vx; dy = joy.vy; }
    let len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; len = 1; }
    if (len > 0) {
      const sp = me.ghost ? SPEED * GHOST_SPEED : SPEED * speedMul(me);
      me.x += dx * sp * dt; me.y += dy * sp * dt;
      facing.x = dx / len; facing.y = dy / len;
    }
    if (me.ghost) { const c = clampBody(me.x, me.y); me.x = c.x; me.y = c.y; }   // un fantôme traverse les joueurs
    else { resolveCollisions(me, null); checkPickup(); }
  }

  // Interpolation des autres joueurs pour un mouvement fluide (les bots sont calculés ici même)
  const k = 1 - Math.exp(-15 * dt);
  for (const id in players) {
    const p = players[id];
    if (p.bot && amHost) continue;
    p.x += (p.tx - p.x) * k;
    p.y += (p.ty - p.y) * k;

/* ---------- Collisions entre joueurs ----------
   Chaque joueur ne déplace que lui-même : s'il chevauche un autre rond, il est repoussé
   juste au contact, le long de la ligne qui relie les deux centres (ce qui le fait glisser). */
function resolveCollisions(body, selfId) {
  const minD = RADIUS * 2;
  for (let pass = 0; pass < 2; pass++) {
    const others = [];
    if (selfId !== null && !me.dead) others.push(me);
    for (const id in players) if (id !== selfId && !players[id].dead) others.push(players[id]);
    for (const o of others) {
      let nx = body.x - o.x, ny = body.y - o.y;
      let d = Math.hypot(nx, ny);
      if (d >= minD) continue;
      if (d < 0.001) { const a = Math.random() * Math.PI * 2; nx = Math.cos(a); ny = Math.sin(a); d = 1; }
      else { nx /= d; ny /= d; }
      const push = minD - d;
      body.x += nx * push;
      body.y += ny * push;

/* ---------- Bots ----------
   Une manche compte toujours au moins MIN_PLAYERS participants : l'hôte complète avec des bots,
   les fait jouer chez lui et envoie leur état à tout le monde. */
const MIN_PLAYERS = 4;
const BOT_SPEED = 270;

function botIds() { return Object.keys(players).filter(id => players[id].bot); }
function humanCount() { return 1 + Object.keys(players).filter(id => !players[id].bot).length; }

// Noms rigolos pour les bots (12 caractères maximum), tirés au hasard sans doublon
const BOT_NAMES = ['Tic-Tac', 'Mèche Folle', 'Pétardo', 'Boum-Boum', 'Dynamitou', 'Tonton Boum',
  'Mamie Mèche', 'Kaboomer', 'Pschitt', 'Badaboum', 'Gros Pétard', 'Étincelle', 'Fusée Molle', 'Patatras'];

function pickBotName(n) {
  const used = new Set(botIds().map(id => players[id].name));
  const free = BOT_NAMES.filter(nm => !used.has(nm));
  return free.length ? free[Math.floor(Math.random() * free.length)] : 'Bot ' + n;
}

function addBot() {
  let n = 1;
  while (players['bot' + n]) n++;
  const id = 'bot' + n;
  const pos = clampField(120 + Math.random() * (WW - 240), 120 + Math.random() * (WH - 240));
  players[id] = { x: pos.x, y: pos.y, tx: pos.x, ty: pos.y, name: pickBotName(n), color: '#888', bot: true,
                  hp: HP_MAX, dead: false, hitAt: 0,
                  bombAt: performance.now() + 1500 + Math.random() * 2000 };
  assignColor(id);
  resolveCollisions(players[id], id);
}

// Complète avec des bots jusqu'à MIN_PLAYERS (hôte uniquement)
function fillBots() {
  if (!amHost) return;
  let need = MIN_PLAYERS - humanCount() - botIds().length;
  while (need-- > 0) addBot();

}

// Retire les bots en trop quand des joueurs arrivent (les bots déjà éliminés partent en premier)
function trimBots() {
  if (!amHost) return;
  let extra = humanCount() + botIds().length - MIN_PLAYERS;
  const ids = botIds().sort((a, b) => (players[b].dead ? 1 : 0) - (players[a].dead ? 1 : 0));
  let changed = false;
  while (extra-- > 0 && ids.length) {
    const id = ids.shift();
    delete players[id];
    delete game.colors[id];
    delete game.scores[id];

  }

function sendBots() {

  broadcast({ t: 'bots', list: botIds().map(id => {

      }

        b.bombAt = now + (game.party ? 900 + Math.random() * 700 : 2200 + Math.random() * 1800); b.cdTotal = b.bombAt - now;
      }

    b.tx = b.x; b.ty = b.y;
  }
}

// Bot fantôme : rôde autour du survivant le plus proche et lance une bombe toutes les 4 à 6 s
function botGhost(b, id, dt, now) {
  const t = nearestEnemy(b.x, b.y, id);
  if (!t) return;
  const ux = (t.x - b.x) / (t.d || 1), uy = (t.y - b.y) / (t.d || 1);
  b.orbit = b.orbit || 1;

  b.x += b.gvx * dt; b.y += b.gvy * dt;
  const c = clampBody(b.x, b.y); b.x = c.x; b.y = c.y;
  if (now >= b.bombAt && t.d <= BOMB_RANGE) {
    const a = Math.random() * Math.PI * 2, err = Math.random() * 40;
    const aim = aimFrom(b.x, b.y, t.x + Math.cos(a) * err, t.y + Math.sin(a) * err);
    launchBomb(id, b.x, b.y, aim.x, aim.y, false, false, true);
    broadcast({ t: 'bomb', owner: id, sx: b.x, sy: b.y, tx: aim.x, ty: aim.y, mega: 0, hr: 0, gl: 1 });
    b.bombAt = now + GHOST_CD + Math.random() * 2000; b.cdTotal = b.bombAt - now;
  }
}

}

      for (let i = 0; i <= N; i++) { const t = i / N, x = x0 + L * t; pts.push([x, y0 + Math.sin(t * Math.PI * 1.6 + ph) * amp - Math.sin(t * Math.PI) * amp * 0.6, Math.pow(Math.sin(Math.PI * t), 0.8)]); }
      const band = (dy, w, col) => {
        c.beginPath();
        pts.forEach((p, i) => c[i ? 'lineTo' : 'moveTo'](p[0], p[1] + dy - p[2] * w / 2));
        for (let i = pts.length - 1; i >= 0; i--) c.lineTo(pts[i][0], pts[i][1] + dy + pts[i][2] * w / 2);
        c.closePath(); c.fillStyle = col; c.fill();
      };
      band(-2.2, W * 0.55, 'rgba(255,246,220,.45)');
      band(0, W, 'rgba(170,118,65,.38)');
    };
    const cols = 5, rows = 4, free = [];
    for (let gy = 0; gy < rows; gy++) for (let gx = 0; gx < cols; gx++) {
      if (rn() < 0.4) { free.push([(gx + 0.5) * WW / cols, (gy + 0.5) * WH / rows]); continue; }
      const cx = (gx + 0.2 + rn() * 0.6) * WW / cols, cy = (gy + 0.2 + rn() * 0.6) * WH / rows;
      const n = 2 + (rn() < 0.5 ? 1 : 0), L = 50 + rn() * 40, ph = rn() * 3, ang = -0.18 + rn() * 0.2;
      c.save(); c.translate(cx, cy); c.rotate(ang);
      for (let k = 0; k < n; k++) ride(-L / 2 + (rn() - 0.5) * 16, (k - (n - 1) / 2) * 10, L * (0.75 + rn() * 0.35), 2.2, ph, 2.8);
      c.restore();
    }
    // petites plaques craquelées (rares, très légères) dans des cases sans rides
    const DK = 'rgba(150,105,60,', LT = 'rgba(255,243,212,';
    const cracks = (cx, cy, R) => {
      const cell = 22, n = Math.floor(2 * R / cell) + 1, P = [];
      for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) P.push([cx - R + i * cell + (rn() - 0.5) * cell * 0.7, cy - R + j * cell + (rn() - 0.5) * cell * 0.7]);
      c.lineCap = 'round'; c.lineJoin = 'round';
      for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) for (const [di, dj] of [[1, 0], [0, 1]]) {
        if (i + di >= n || j + dj >= n) continue;
        const p = P[j * n + i], q = P[(j + dj) * n + i + di], mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
        const d = Math.hypot(mx - cx, (my - cy) * 1.3) / R; if (d > 1 || rn() < 0.2) continue;
        const al = (1 - d) * (1 - d), k = [mx + (rn() - 0.5) * 5, my + (rn() - 0.5) * 5];
        c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(k[0], k[1]); c.lineTo(q[0], q[1]); c.strokeStyle = DK + (0.5 * al).toFixed(3) + ')'; c.lineWidth = 1.6; c.stroke();
        c.beginPath(); c.moveTo(p[0] + 1, p[1] + 1.2); c.lineTo(k[0] + 1, k[1] + 1.2); c.lineTo(q[0] + 1, q[1] + 1.2); c.strokeStyle = LT + (0.55 * al).toFixed(3) + ')'; c.lineWidth = 1.1; c.stroke();
      }
    };
    free.sort(() => rn() - 0.5).slice(0, 2).forEach(([x, y]) => cracks(x + (rn() - 0.5) * 30, y + (rn() - 0.5) * 30, 50 + rn() * 15));
    // quelques galets et coquillages, éclairés en haut à gauche
    const pebble = (x, y, r, rot) => {
      c.save(); c.translate(x, y); c.rotate(rot);
      c.fillStyle = 'rgba(105,62,25,.25)'; c.beginPath(); c.ellipse(r * 0.35, r * 0.35, r * 1.25, r * 0.85, 0, 0, 7); c.fill();
      const g = c.createLinearGradient(-r, -r, r, r); g.addColorStop(0, '#dccfb8'); g.addColorStop(1, '#9b8a72');
      c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, r * 1.25, r * 0.85, 0, 0, 7); c.fill(); c.lineWidth = 1.4; c.strokeStyle = 'rgba(60,40,20,.6)'; c.stroke();
      c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-r * 0.45, -r * 0.3, r * 0.35, r * 0.18, -0.3, 0, 7); c.fill(); c.restore();
    };
    const shell = (x, y, s, rot) => {
      c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
      c.fillStyle = 'rgba(105,62,25,.22)'; c.beginPath(); c.ellipse(2, 2, 8, 6, 0, 0, 7); c.fill();
      c.beginPath(); c.moveTo(0, 5); c.arc(0, 5, 9, Math.PI * 1.12, Math.PI * 1.88); c.closePath(); c.fillStyle = '#f6dfcf'; c.fill(); c.lineWidth = 1.3; c.strokeStyle = 'rgba(120,70,50,.7)'; c.stroke();
      c.strokeStyle = 'rgba(200,130,110,.7)'; c.lineWidth = 1;
      for (const a of [-0.7, -0.35, 0, 0.35, 0.7]) { c.beginPath(); c.moveTo(0, 5); c.lineTo(Math.sin(a) * 8, 5 - Math.cos(a) * 8); c.stroke(); }
      c.restore();
    };
    for (let i = 0; i < 8; i++) pebble(30 + rn() * (WW - 60), 30 + rn() * (WH - 60), 2.2 + rn() * 2.8, rn() * 3);
    for (let i = 0; i < 3; i++) shell(40 + rn() * (WW - 80), 40 + rn() * (WH - 80), 0.75 + rn() * 0.3, rn() * 2 - 1);
    c.strokeStyle = 'rgba(120,80,40,.1)'; c.lineWidth = 2;
    for (let x = 100; x < WW; x += 100) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, WH); c.stroke(); }
    for (let y = 100; y < WH; y += 100) { c.beginPath(); c.moveTo(0, y); c.lineTo(WW, y); c.stroke(); }
    // ombre de la mousse sur le sable : bords haut et gauche seulement
    c.beginPath(); c.rect(-60, -60, WW + 120, WH + 120); path(c, SB, 10, 9, true); c.fillStyle = SHADE + '.26)'; c.fill('evenodd');
    c.restore();
    path(c, SB); c.lineWidth = 3.5; c.strokeStyle = INK; c.stroke();
    // touffes qui mordent un peu sur le sable
    SD = 41;
    for (const p of SB) {
      if (rn() > 0.07) continue;
      const x = p[0], y = p[1], r = 4 + rn() * 4;
      c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = M2; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
      c.beginPath(); c.arc(x + p[2] * 4, y + p[3] * 4, r + 1, 0, 7); c.fill();
    }
  }

  const IX = 80, IY = 70, IY2 = 120;               // emprise de l'île (avec ombre et écume) autour du terrain
  let layer = null, layerK = 0, seaKey = '';
  function getLayer(k) {
    if (layer && Math.abs(layerK - k) < 0.01) return layer;
    const LW = WW + 2 * IX, LH = WH + IY + IY2;
    const kk = Math.min(k, Math.sqrt(9e6 / (LW * LH)));          // plafond mémoire (iPhone)
    const cv = document.createElement('canvas'); cv.width = Math.ceil(LW * kk); cv.height = Math.ceil(LH * kk);
    const c = cv.getContext('2d');
    if (!c || !c.setTransform) return null;
    c.setTransform(kk, 0, 0, kk, IX * kk, IY * kk);
    try { paint(c); } catch (e) { console.warn('décor', e); }
    layer = cv; layerK = k; return layer;
  }
  // La mer est fixe : dessinée une fois dans un canevas placé derrière le jeu (redessinée au redimensionnement).
  // En portrait, elle couvre toute la largeur que la caméra peut parcourir et glisse avec elle (transform CSS).
  function renderSea(el, W, H, dpr, scale, oy, extra) {
    const key = [W, H, dpr, scale, oy, extra].join('|');
    if (key === seaKey) return; seaKey = key;
    const SW = W + extra;
    el.style.width = SW + 'px'; el.style.height = H + 'px';
    el.width = Math.round(SW * dpr); el.height = Math.round(H * dpr);
    const c = el.getContext('2d'); if (!c || !c.setTransform) return;
    const ox0 = extra ? 0 : (W - WW * scale) / 2;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = c.createLinearGradient(0, oy - YP * scale, 0, oy + (WH + YP2) * scale); g.addColorStop(0, '#3bb3c1'); g.addColorStop(1, '#1f8a9c');
    c.fillStyle = g; c.fillRect(0, 0, SW, H);
    c.translate(ox0, oy); c.scale(scale, scale);
    try { paintSea(c, { x0: -ox0 / scale - 20, y0: -oy / scale - 20, x1: (SW - ox0) / scale + 20, y1: (H - oy) / scale + 20 }); } catch (e) { console.warn('mer', e); }
  }
  // vagues animées autour de l'île + île (contexte déjà en coordonnées terrain)
  function draw(c, now, k) {
    if (c.setLineDash && typeof Path2D !== 'undefined') {
      if (!WAVES) WAVES = mkWaves();
      c.save(); c.lineCap = 'round';
      WAVES.forEach((wv, i) => {
        const br = 0.75 + 0.25 * Math.sin(now / 900 + i * 1.7);
        c.setLineDash([26 + i * 8, 14 + i * 6]); c.lineDashOffset = (i % 2 ? 1 : -1) * now / 140 + i * 17;
        c.strokeStyle = 'rgba(255,255,255,' + (wv.a * br).toFixed(3) + ')'; c.lineWidth = wv.w; c.stroke(wv.p);
      });
      c.restore();
    }
    const L = getLayer(k);
    if (L) c.drawImage(L, -IX, -IY, WW + 2 * IX, WH + IY + IY2);
  }
  return { draw, renderSea, prewarm: getLayer, TOP: RIM + 24, BOTTOM: RIM + CLIFF + 32, SIDE: RIM + 20 };
})();

function draw(now) {
  updateCamera(now);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(ox, oy);
  const nowShake = performance.now();
  if (nowShake < shakeUntil) {
    ctx.translate((Math.random() * 2 - 1) * shakeAmp, (Math.random() * 2 - 1) * shakeAmp);
  } else shakeAmp = 0;
  ctx.scale(scale, scale);

  // décor : eau, vagues, île (la zone de jeu reste le rectangle WW × WH)
  syncSea();
  ISL.draw(ctx, now, scale * dpr);

  // Pièces (désactivées depuis le mode éliminations)
  const pulse = Math.sin(now / 200) * 1.5;
  for (const c of game.coins) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, COIN_R + pulse, 0, Math.PI * 2);
    ctx.fillStyle = '#f5c542';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#b8860b';
    ctx.stroke();
  }

  drawGlue(now);
  updateGlueTrails(now); drawGlueTrails(now);
  drawPickup(now);
  drawBombZones(performance.now());
  drawAimPreview(performance.now());
  // les fantômes passent en arrière-plan : sous les joueurs vivants, pour que les Kaboom restent bien visibles
  const ghosts = Object.keys(players).filter(id => players[id].dead && players[id].ghost).map(id => [players[id], id, false]);
  if (me.dead && me.ghost) ghosts.push([me, myId, true]);
  for (const [p, id, isMe] of ghosts) drawGhost(p, colorOf(id), isMe ? me.name : p.name, isMe, now);
  const bodies = Object.keys(players).filter(id => !players[id].dead).map(id => [players[id], id, false]);
  if (!me.dead) bodies.push([me, myId, true]);
  for (const [p, id] of bodies) drawSpeedTrail(p, colorOf(id), now);
  for (const [p, id, isMe] of bodies) {
    drawShieldBubble(p, now);
    drawPlayer(p, colorOf(id), isMe ? me.name : p.name, isMe, now);
  }
  for (const [p] of bodies) { drawHealFx(p, now); drawBadges(p, now); }
  const chp = champion();
  if (chp && !chp.dead) drawCrown(chp, now);
  drawShockwaves();
  drawBombs(performance.now());
  drawFlyers(now);
  drawPopups(performance.now());
  ctx.restore();
  // fil des éliminations et messages : calés sur la partie visible du terrain
  {
    const right = Math.min(W, ox + WW * scale), left = Math.max(0, ox);
    drawFeed(performance.now());
    ctx.save();
    ctx.translate(right - WW * scale, oy);
    ctx.scale(scale, scale);
    if (hostLeft) {
      ctx.textAlign = 'center';
      comicText("L'hôte a quitté : recrée une salle !", ((left + right) / 2 - (right - WW * scale)) / scale, WH - 22, portrait ? 30 : 20, '#ffd93b');
    }
    ctx.restore();
  }
  drawOffscreen(now);

  // Commandes dessinées par-dessus, en coordonnées écran
  if (!waiting) { drawJoystick(); drawAimStick(); }
  // Bandeaux et récapitulatif en coordonnées écran, lisibles quelle que soit la taille du téléphone
  if (me.dead && !game.winner) drawEliminated(now);
  updatePartyUi(now);
  if (game.party && !game.endResult) drawPartyBanner(now);
  if (!waiting && !game.winner && !game.endResult) drawCountdown(now);
  drawRoundTimer(now);
  if (game.endResult === 'champion') drawGrandWinner(now);
  else if (game.endResult === 'fallen') drawFallen(now);
  else confetti.length = 0;
  if (game.winner) {
    if (!winSeenAt) winSeenAt = performance.now();
    if (performance.now() - winSeenAt >= RECAP_DELAY) {
      if (!recapT0) { recapT0 = performance.now(); SFX.roundEnd(game.winner === myId, !!game.matchWinner); }
      drawRecap(performance.now());
    }
  }
  else { recapT0 = 0; winSeenAt = 0; }
}

/* ---------- Fête du champion ---------- */
// Couronne dorée qui flotte au-dessus du champion, avec un halo qui pulse
function drawCrown(p, now) {
  const bob = Math.sin(now / 220) * 3;
  ctx.save();
  ctx.translate(p.x, p.y - RADIUS - 34 + bob);
  ctx.beginPath();
  ctx.moveTo(-20, 10); ctx.lineTo(-22, -10); ctx.lineTo(-10, 0); ctx.lineTo(0, -16);
  ctx.lineTo(10, 0); ctx.lineTo(22, -10); ctx.lineTo(20, 10); ctx.closePath();
  ctx.fillStyle = YELLOW; ctx.fill();
  ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.stroke();
  ctx.fillStyle = RED;
  for (const [cx, cy] of [[-22, -10], [0, -16], [22, -10]]) { ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 2; ctx.stroke(); }
  ctx.restore();
  // halo doré
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.25 * Math.sin(now / 160);
  ctx.beginPath(); ctx.arc(p.x, p.y, RADIUS + 9, 0, Math.PI * 2);
  ctx.lineWidth = 5; ctx.strokeStyle = YELLOW; ctx.stroke();
  ctx.restore();
}

// Confettis en coordonnées écran
const confetti = [];
const CONF_COLORS = ['#ffd93b', '#e8302a', '#3b8bff', '#2fd17a', '#ffffff', '#b46cff'];
function drawConfetti(now) {
  if (confetti.length < 90 && Math.random() < 0.6) {
    confetti.push({ x: Math.random() * W, y: -12, vx: (Math.random() - 0.5) * 40, vy: 60 + Math.random() * 80,
                    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 8, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4,
                    c: CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)], t: now });
  }
  ctx.save();
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    const dt = Math.min(0.05, (now - c.t) / 1000); c.t = now;
    c.x += c.vx * dt + Math.sin(now / 300 + i) * 0.6; c.y += c.vy * dt; c.r += c.vr * dt;
    if (c.y > H + 20) { confetti.splice(i, 1); continue; }
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r);
    ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }
  ctx.restore();
}

// Bandeau du défi : grand au début, puis réduit en cartouche en haut à gauche. L'étoile affiche le chrono.
function drawPartyBanner(now) {
  const name = getName(game.matchWinner);
  const meChamp = game.matchWinner === myId;
  const t = now - (partyT0 || now);
  const m = t < 3200 ? 0 : Math.min(1, (t - 3200) / 500);
  const e = m * m * (3 - 2 * m);
  const big = { w: Math.min(W - 24, 560), h: 64 };
  big.x = (W - big.w) / 2; big.y = 10;
  const small = { x: 10, y: 10, w: Math.min(290, W * 0.5), h: 50 };
  const bx = big.x + (small.x - big.x) * e, by = big.y + (small.y - big.y) * e;
  const bw = big.w + (small.w - big.w) * e, bh = big.h + (small.h - big.h) * e;
  const title = e < 0.5 ? (meChamp ? 'TIENS 10 SECONDES !' : 'ÉLIMINEZ ' + name.toUpperCase() + ' !')
                        : (meChamp ? 'TIENS BON !' : 'CIBLE : ' + name.toUpperCase());
  const sub = meChamp ? 'Tout le monde te vise !' : name + ' doit tenir 10 secondes';
  const secs = now < goAt ? PARTY_MS / 1000 : Math.max(0, Math.ceil((partyEndsAt - now) / 1000));
  ctx.save();
  const drop = t < 300 ? -(bh + 30) * (1 - t / 300) : 0;
  ctx.translate(0, drop);
  comicPanel(bx, by, bw, bh, YELLOW);
  // étoile rouge avec le chrono, qui bat plus vite à la fin
  const sr = 34 - 10 * e;
  ctx.save();
  ctx.translate(bx + sr + 4, by + bh / 2);
  const k = 1 + (secs <= 3 ? 0.12 : 0.06) * Math.sin(now / (secs <= 3 ? 80 : 150));
  ctx.scale(k, k);
  ctx.beginPath();
  for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, r = i % 2 ? sr * 0.65 : sr; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath();
  ctx.fillStyle = RED; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = Math.round(26 - 8 * e) + 'px ' + TITLE_FONT; ctx.fillStyle = '#fff'; ctx.fillText(String(secs), 0, 2);
  ctx.restore();
  const tx = bx + sr * 2 + 14;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let fs = Math.round(26 - 9 * e);
  ctx.font = fs + 'px ' + TITLE_FONT;
  while (ctx.measureText(title).width > bx + bw - tx - 10 && fs > 11) { fs -= 1; ctx.font = fs + 'px ' + TITLE_FONT; }
  ctx.fillStyle = INK;
  ctx.fillText(title, tx, by + bh * 0.38);
  fitSize(sub, Math.round(14 - 3 * e), bx + bw - tx - 10, '', BODY_FONT);
  ctx.fillText(sub, tx, by + bh * 0.74);
  ctx.restore();
}

// Compte à rebours de début de manche : une grosse bombe dont la mèche brûle, 3, 2, 1… GO !
let cdSoundN = 0;   // dernier chiffre annoncé par un bip
function drawCountdown(now) {
  const left = goAt - now;
  if (isFinite(left)) {
    const n = left > 0 ? Math.ceil(left / 1000) : 0;
    if (n !== cdSoundN) { if (n > 0 && n <= 5) SFX.beep(); else if (n === 0 && cdSoundN > 0) SFX.go(); cdSoundN = n; }
  }
  if (left <= -500) return;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const r = Math.max(34, Math.min(W, H) * 0.1);
  if (left > 0) {
    ctx.fillStyle = 'rgba(8,9,14,0.55)';
    ctx.fillRect(0, 0, W, H);
    const prog = 1 - left / COUNTDOWN_MS;
    const n = Math.ceil(left / 1000);
    const into = 1 - (left % 1000 || 1000) / 1000;          // 0 au début de chaque seconde
    const pop = into < 0.15 ? 1.25 - 0.25 * (into / 0.15) : 1;
    const R = Math.max(34, Math.min(W, H) * 0.11);
    const cx = W / 2, cy = H * 0.46;
    const wob = Math.sin(now / 35) * 0.05 * prog;            // la bombe tremble de plus en plus
    drawCountdownBomb(cx - R * 0.08, cy + R * 0.08, R, prog, now, wob, n, pop);
    const label = game.party ? (game.matchWinner === myId ? 'FUIS ET ASSOMME-LES !' : 'VISEZ LE CHAMPION !') : 'PRÊTS ?';
    const fsz = fitSize(label, Math.round(Math.max(24, R * 0.42)), W - 40);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = fsz + 'px ' + TITLE_FONT;
    const lw = ctx.measureText(label).width + 34, lh = fsz + 18, ly = Math.min(H - lh - 14, cy + R * 1.45);
    comicPanel(cx - lw / 2, ly, lw, lh, YELLOW);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = INK; ctx.font = fsz + 'px ' + TITLE_FONT;
    ctx.fillText(label, cx, ly + lh / 2 + 1);
  } else {
    // « GO ! » qui éclate dans une étoile
    const t = -left / 500;
    const sc = 0.6 + 0.7 * Math.min(1, t * 3);
    ctx.globalAlpha = 1 - Math.max(0, t - 0.5) * 2;
    ctx.translate(W / 2, H / 2);
    ctx.scale(sc, sc);
    ctx.beginPath();
    for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2, rr = i % 2 ? r * 0.9 : r * 1.4; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath();
    ctx.fillStyle = YELLOW; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    drawSplash('GO!', 0, 2, Math.round(r * 0.95), '#ffffff', RED, 1);
  }
  ctx.restore();
}

// Écran spécial : le champion a tenu 10 secondes
function drawGrandWinner(now) {
  const t = now - (endT0 || now);
  const id = game.matchWinner, name = getName(id), col = colorOf(id);
  ctx.save();
  ctx.fillStyle = 'rgba(10,10,20,' + Math.min(0.82, t / 400) + ')';
  ctx.fillRect(0, 0, W, H);
  // rayons dorés qui tournent
  const cx = W / 2, cy = H * 0.42, R = Math.hypot(W, H);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(now / 5000);
  ctx.fillStyle = 'rgba(255,217,59,0.13)';

const SHADOW = '#1f7f93', EDGE = '#2c2536', INK = '#0b0c0f', PAPER = '#fff6dc', YELLOW = '#ffd93b', RED = '#e8302a', ORANGE = '#ffe9b8';

// Texte BD : lettres au contour noir épais

  }
  ctx.strokeText(text, x, y);

    const bl = ctx.textBaseline;

// Case de BD : ombre décalée, papier, contour épais, trame dans un coin
// Case de BD : cadre légèrement irrégulier, double ombre dure (rouge puis noire), trame en haut à gauche, gros trait

function comicPanel(x, y, w, h, fill, hdr) {

// Fil des coups (à droite, sous le chrono) : chaque coup porté défile, les K.O. claquent

// Chrono de manche (en haut à droite) façon comics : petite bombe à mèche + chiffres en relief

  const el = now - goAt, left = ROUND_MS - el;

    ctx.translate(tb.cx + (Math.random() - 0.5) * jit, tb.cy + (Math.random() - 0.5) * jit); ctx.rotate(-0.035); ctx.scale(pop, pop);

// HURRY UP : explosion BD qui claque en haut de l'écran, bords rouges qui pulsent,

function drawHurry(t, now) {
  const D = 1800;
  if (t > D) return;
  const fs = Math.max(34, Math.min(64, Math.round(H / 7.5)));
  // bords de l'écran qui rougissent en rythme (alerte)

    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(255,40,30,0)'); g.addColorStop(1, 'rgba(255,40,30,' + a.toFixed(3) + ')');

  else if (t < 260) sc = 0.85 + 0.3 * ((t - 140) / 120);     // …s'écrase…
  else if (t < 360) sc = 1.15 - 0.15 * ((t - 260) / 100);    // …rebondit

// K.O. : le personnage est projeté vers nous (il grossit, tourne) puis retombe et sort par le bas de l'écran
// K.O. façon dessin animé : le Kaboom s'écrase, rebondit deux fois en s'aplatissant à chaque contact,
// puis un dernier rebond l'envoie vers nous et il sort de l'écran par le bas en tournoyant.
function addFlyer(p, color, now) {
  const dir = (p.x < WW / 2 ? 1 : -1) * (0.7 + Math.random() * 0.5);
  flyers.push({ x: p.x, y: p.y, color, t0: now, dir,

function drawFlyers(now) {

    } else if (t < L2) {                              // 2e bond, plus bas
      const u = (t - L1) / (L2 - L1); h = 4 * 46 * u * (1 - u);
      rot = -d * Math.sin(u * Math.PI) * 0.45;
    }

    for (const L of [L1, L2]) { const q = (t - L) / 0.07; if (q >= 0 && q < 1) { const k = Math.sin((1 - q) * Math.PI / 2); sx = 1 + 0.4 * k; sy = 1 - 0.35 * k; } }

    sc = 1 + 0.3 * run;
    if (outU > 0) {                                   // dernier rebond : vers la caméra, puis chute hors de l'écran
      const u = outU;
      y = f.y - 150 * u + (WH - f.y + 520 + 150) * u * u;

      if (u < 0.12) { sy = 1 + 0.3 * (1 - u / 0.12); sx = 1 - 0.18 * (1 - u / 0.12); }
    } else y = f.y - h;

    if (outU === 0) {

      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = GROUND_SH;
      ctx.beginPath(); ctx.ellipse(x + r * 0.12, f.y + r * 1.05, r * (1 - h / 260) * sc, r * 0.3 * (1 - h / 260) * sc, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    for (const L of [L1, L2]) {
      const q = (t - L) / 0.22;
      if (q < 0 || q >= 1) continue;
      const lx = f.x + d * 55 * (1 - Math.pow(1 - Math.min(1, L / L2), 2));
      ctx.save(); ctx.globalAlpha = 0.8 * (1 - q);
      for (const s of [-1, 1]) for (const k of [0, 1]) {
        ctx.beginPath(); ctx.ellipse(lx + s * (r * 0.8 + q * r * (1.1 + k * 0.6)), f.y + r * 0.95 - q * r * (0.3 + k * 0.3), r * (0.28 - k * 0.08) * (1 - q * 0.4), r * (0.2 - k * 0.05) * (1 - q * 0.4), 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fff6dc'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save();
    // pivot aux pieds pour l'écrasement, au centre pour la rotation
    ctx.translate(x, y + r * sc); ctx.scale(sc * sx, sc * sy); ctx.translate(0, -r); ctx.rotate(rot);
    drawPlayer(f.f, f.color, '', false, now);
    ctx.restore();
  }
}

// Empreintes : en sortant de la glu, un joueur laisse 3 traces collantes derrière lui
const TRAIL_PRINTS = 3, TRAIL_MS = 2500, TRAIL_STEP = 13;
function updateGlueTrails(now) {
  const all = [me].concat(Object.values(players));
  for (const p of all) {
    if (!p || p.dead || p.ghost) continue;
    let inG = false;
    for (const z of glueZones) if (now - z.t0 < GLUE_MS && Math.hypot(p.x - z.x, p.y - z.y) < z.r + RADIUS * 0.3) { inG = true; break; }
    const st = p._gt || (p._gt = { in: false, left: 0, lx: p.x, ly: p.y, side: 1 });
    if (st.in && !inG) { st.left = TRAIL_PRINTS; st.lx = p.x; st.ly = p.y; }
    if (inG) st.left = 0;
    st.in = inG;
    if (st.left > 0) {
      const d = Math.hypot(p.x - st.lx, p.y - st.ly);
      if (d >= TRAIL_STEP) {
        glueTrails.push({ x: p.x, y: p.y + RADIUS * 0.95, ang: Math.atan2(p.y - st.ly, p.x - st.lx), side: st.side, t0: now });
        st.side = -st.side; st.left--; st.lx = p.x; st.ly = p.y;
      }
    } else { st.lx = p.x; st.ly = p.y; }
  }
  for (let i = glueTrails.length - 1; i >= 0; i--) if (now - glueTrails[i].t0 > TRAIL_MS) glueTrails.splice(i, 1);
}
function drawGlueTrails(now) {
  if (!glueTrails.length) return;
  ctx.save();
  for (const t of glueTrails) {
    const age = now - t.t0, a = age > TRAIL_MS - 1200 ? (TRAIL_MS - age) / 1200 : 1;
    const grow = age < 150 ? 0.5 + 0.5 * (age / 150) : 1;
    ctx.save();
    ctx.globalAlpha = 0.85 * a;
    ctx.translate(t.x - Math.sin(t.ang) * 5 * t.side, t.y + Math.cos(t.ang) * 5 * t.side * 0.5);
    ctx.rotate(t.ang); ctx.scale(grow, grow);
    ctx.beginPath(); ctx.ellipse(0, 0, 6, 3.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(110,225,70,0.6)'; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(40,120,30,0.65)'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-1.2, -0.9, 1.8, 0.8, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// Flaque de glu verte : forme molle qui frémit, bulles, contour encre ; elle s'étale puis se résorbe
function drawGlue(now) {
  for (const z of glueZones) {
    const age = now - z.t0;
    if (age > GLUE_MS) continue;
    const grow = age < 180 ? 0.4 + 0.6 * (age / 180) : 1;
    const fade = age > GLUE_MS - 800 ? (GLUE_MS - age) / 800 : 1;
    const R = z.r * grow * (0.6 + 0.4 * fade);
    ctx.save();
    ctx.globalAlpha = fade;
    const blob = (rr, ph) => {
      ctx.beginPath();
      for (let i = 0; i <= 48; i++) {
        const a = i / 48 * Math.PI * 2, w = 1 + 0.1 * Math.sin(a * 3 + z.seed) + 0.06 * Math.sin(a * 5 + z.seed * 2) + 0.03 * Math.sin(now / 300 + a * 4 + (ph || 0));
        const px = z.x + Math.cos(a) * rr * w, py = z.y + Math.sin(a) * rr * w * 0.82;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
    };
    // liquide gluant : presque transparent au centre, plus épais sur le bord (ménisque)
    const g = ctx.createRadialGradient(z.x - R * 0.2, z.y - R * 0.2, R * 0.1, z.x, z.y, R * 1.05);
    g.addColorStop(0, 'rgba(150,240,100,0.22)');
    g.addColorStop(0.65, 'rgba(100,205,60,0.38)');
    g.addColorStop(1, 'rgba(50,150,35,0.65)');
    blob(R); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(40,120,30,0.8)'; ctx.stroke();
    // reflets mouillés
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(z.x - R * 0.3, z.y - R * 0.32, R * 0.32, R * 0.12, -0.25, Math.PI * 1.1, Math.PI * 1.75);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(z.x + R * 0.38, z.y + R * 0.2, R * 0.05, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
    // petites bulles qui remontent
    for (let k = 0; k < 4; k++) {
      const a = z.seed + k * 1.7, d = R * (0.2 + 0.13 * k);
      const bx = z.x + Math.cos(a) * d, by = z.y + Math.sin(a) * d * 0.8, br = 2.5 + 1.5 * Math.sin(now / 250 + k);
      ctx.beginPath(); ctx.arc(bx, by, Math.max(0.8, br), 0, Math.PI * 2);
      ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(220,255,190,0.6)'; ctx.stroke();
    }
    ctx.restore();
  }
}
// Boule de glu en vol
function drawGlueBall(x, y, now, spin) {
  const r = BOMB_R * 0.95;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(spin * 0.3);
  ctx.beginPath();
  for (let i = 0; i <= 32; i++) { const a = i / 32 * Math.PI * 2, w = 1 + 0.12 * Math.sin(a * 3 + now / 90); i ? ctx.lineTo(Math.cos(a) * r * w, Math.sin(a) * r * w) : ctx.moveTo(Math.cos(a) * r * w, Math.sin(a) * r * w); }
  ctx.closePath();
  ctx.fillStyle = '#7be04a'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.35, r * 0.25, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
  ctx.restore();
}
function addSplat(x, y) {
  popups.push({ x, y: Math.max(44, y - 30), word: 'SPLAT!', sub: null, fill: '#d6ff9a', txt: '#3fae2a', ko: false, dmg: null, rot: -0.06, fx: true, t0: performance.now() });
}

// Fantôme : drap translucide à la couleur du joueur, bas ondulé, gros yeux ; le sien affiche sa grosse recharge
// Fantôme : clin d'œil aux fantômes des jeux d'arcade — dôme, jupe en dents qui frétille,
// grands yeux qui regardent dans le sens du déplacement. Couleur du joueur, translucide, sous les joueurs vivants.
function drawGhost(p, color, name, isMe, now) {
  if (p.bobPhase == null) p.bobPhase = Math.random() * 6.28;
  const r = RADIUS * GHOST_SIZE;
  // direction du regard : vitesse lissée
  if (p._gx == null) { p._gx = p.x; p._gy = p.y; p._gvx = 0; p._gvy = 0; }
  const dx = p.x - p._gx, dy = p.y - p._gy; p._gx = p.x; p._gy = p.y;
  if (Math.abs(dx) < 40 && Math.abs(dy) < 40) { p._gvx += (dx - p._gvx) * 0.2; p._gvy += (dy - p._gvy) * 0.2; }
  const sp = Math.hypot(p._gvx, p._gvy), lx = sp > 0.3 ? p._gvx / sp : 0, ly = sp > 0.3 ? p._gvy / sp : 0.15;
  const x = p.x, y = p.y - 4 + Math.sin(now / 300 + p.bobPhase) * 2.5;
  const top = y - r * 0.15, bot = y + r * 0.95;                  // centre du dôme, bas de la jupe
  const m = Math.min(1, sp / 3);                                  // 0 au repos, 1 en pleine vitesse
  const ph = now / (sp > 0.3 ? 110 : 320) + p.bobPhase;          // l'ourlet ondule plus vite en se déplaçant
  const shape = () => {
    ctx.beginPath();
    ctx.arc(x, top, r, Math.PI, 0);
    ctx.lineTo(x + r, bot - r * 0.1);
    // ourlet en 4 festons arrondis qui ondulent
    const n = 4, w = 2 * r / n;
    for (let i = 0; i < n; i++) {
      const x0 = x + r - i * w, x1 = x0 - w, dip = r * (0.34 + 0.1 * Math.sin(ph + i * 1.4) * (0.5 + m));
      ctx.bezierCurveTo(x0 - w * 0.05, bot + dip, x1 + w * 0.05, bot + dip, x1, bot - r * 0.1);
    }
    ctx.lineTo(x - r, top);
    ctx.closePath();
  };
  ctx.save();
  ctx.globalAlpha = isMe ? 0.75 : 0.6;              // en retrait : les Kaboom vivants restent les plus visibles
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // penche dans le sens de la marche et s'étire un peu
  ctx.translate(x, bot); ctx.rotate(lx * 0.18 * m); ctx.scale(1 - 0.06 * m, 1 + 0.08 * m); ctx.translate(-x, -bot);
  shape();
  const g = ctx.createLinearGradient(0, top - r, 0, bot);
  g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(225,232,255,.7)');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = r * 0.09; ctx.strokeStyle = INK; ctx.stroke();
  // petit reflet sur le dôme
  ctx.save(); ctx.translate(x - r * 0.5, top - r * 0.45); ctx.rotate(-0.8);
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.22, r * 0.09, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fill(); ctx.restore();
  // yeux : grands blancs, pupilles tournées vers le déplacement
  for (const s of [-1, 1]) {
    const ex = x + s * r * 0.38 + lx * r * 0.08, ey = top + r * 0.05 + ly * r * 0.06;
    ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.26, r * 0.32, 0, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = r * 0.06; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.arc(ex + lx * r * 0.12, ey + ly * r * 0.15, r * 0.13, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();   // pupilles à la couleur du joueur
  }
  // étoile : barrette des Kaboom, jauge de recharge de la bombe à glu
  const cg = starCharge(isMe, now, p);
  const sx = x + r * 0.72 + Math.sin(now / 23) * cg.shake, sy = top - r * 0.82 + Math.cos(now / 29) * cg.shake, SR = r * 0.55 * cg.scale * (1 + 0.45 * cg.pop);
  const srot = 0.3 + Math.sin(now / 37) * cg.shake * 0.08;
  drawStarPop(sx, sy, SR, cg.pop);
  starPath(sx, sy, SR, srot); ctx.fillStyle = '#ffd93b'; ctx.fill(); ctx.lineWidth = r * 0.09; ctx.strokeStyle = INK; ctx.stroke();
  starPath(sx, sy, SR * 0.45, srot); ctx.fillStyle = '#fff3a8'; ctx.fill();
  ctx.restore();
}


/* ---------- Tableau des scores ---------- */

function updateHud() {
  const hud = $('hud');
  const rows = [{ id: myId, name: me.name, color: colorOf(myId), me: true }];
  for (const id in players) rows.push({ id, name: players[id].name || '?', color: colorOf(id) });
  rows.sort((a, b) => (game.scores[b.id] || 0) - (game.scores[a.id] || 0));

  hud.style.visibility = waiting || game.winner || game.party ? 'hidden' : 'visible';
  updateWaitRoom();
  hud.replaceChildren();
  const head = document.createElement('div');
  head.className = 'head';
  head.appendChild(document.createTextNode(game.party ? 'Défi du champion' : 'Manche ' + ((game.round || 0) + (game.winner ? 0 : 1))));
  const sm = document.createElement('small'); sm.textContent = roomCode === 'SOLO' || !roomCode ? 'SOLO' : 'SALLE ' + roomCode; head.appendChild(sm);
  hud.appendChild(head);

  for (const r of rows) {
    const line = document.createElement('div');
    line.className = 'r' + (r.me ? ' me' : '');
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.backgroundColor = r.color || '#888';
    line.appendChild(dot);
    const pl = r.me ? me : players[r.id];
    const wins = game.scores[r.id] || 0;
    if (pl && pl.dead) line.className += ' out';   // éliminé : barré
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name + (r.me ? ' (toi)' : ''); line.appendChild(nm);
    if (!r.me && !(players[r.id] && players[r.id].bot)) {
      const i = info[r.id] || {};
      const sub = document.createElement('span');
      sub.className = 'sub';
      sub.textContent = (i.rtt != null ? i.rtt + ' ms' : '… ms');
      line.appendChild(sub);
    }
    if (pl && pl.dead && !game.winner) { const k = document.createElement('span'); k.className = 'ko'; k.textContent = 'K.O.'; line.appendChild(k); }
    const st = document.createElement('span'); st.className = 'stars';
    for (let k = 0; k < MATCH_WINS; k++) { const it = document.createElement('i'); if (k < wins) it.className = 'on'; st.appendChild(it); }
    line.appendChild(st);
    hud.appendChild(line);
  }
}

    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
