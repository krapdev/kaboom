<meta name="description" content="Kaboom : jeu de bombes multijoueur entre amis, le dernier debout gagne !">
<meta name="theme-color" content="#1f8a9c">
<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<style>
  /* Style BD : encre noire, papier crème, jaune et rouge d'imprimerie, trame de points */
  :root {
    --ink: #0b0c0f; --edge: #2c2536; --shadow: #1f7f93; --paper: #fff6dc; --yellow: #ffd93b; --red: #e8302a; --night: #1a1d2b;
    --title: 'Lilita One', 'Arial Black', system-ui, sans-serif;
    --body: 'Lilita One', 'Arial Black', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
  body {
    background: var(--night) radial-gradient(rgba(255,255,255,0.07) 1.4px, transparent 1.6px) 0 0 / 14px 14px;
    color: var(--ink); font-family: var(--body); font-weight: 400; letter-spacing: .3px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  input { -webkit-user-select: text; user-select: text; }

  #lobby { position: absolute; inset: 0; z-index: 5; display: flex;
           padding: 16px max(16px, env(safe-area-inset-left, 0px)) 16px max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
  /* case de BD : cadre irrégulier à gros trait, double ombre dure rouge + noire */
  .panel { --pt: 28px; --px: 24px; position: relative; margin: auto; width: min(100%, 380px); padding: var(--pt) var(--px) 24px;
           display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: var(--ink);
           filter: drop-shadow(6px 6px 0 var(--shadow)); }
  .panel::after, .panel::before { content: ""; position: absolute; pointer-events: none; z-index: -1; }
  .panel::after { inset: 0; background: var(--edge); clip-path: var(--shape); z-index: -2; }
  .panel::before { inset: 4px; clip-path: var(--shape);
           background: radial-gradient(rgba(240,120,40,0.38) 1.6px, transparent 1.9px) 0 0 / 8px 8px, #ffe9b8; }
  .panel { --shape: polygon(0.5% 0.8%, 99.5% 0%, 100% 99.2%, 0% 100%); isolation: isolate; }
  /* bandeau de tête : case de BD bleue, rayons, nuages, coupée en biais */
  .hdr { position: relative; isolation: isolate; align-self: stretch; display: flex; flex-direction: column; align-items: center; gap: 10px;
         margin: calc(6px - var(--pt)) calc(6px - var(--px)) 8px; padding: 18px 16px 36px; }
  .hdr::before, .hdr::after { content: ""; position: absolute; inset: 0; z-index: -1; }
  .hdr::before { background: var(--edge); clip-path: polygon(0 0, 100% 0, 100% 86%, 0 100%); z-index: -2; }
  .hdr::after { z-index: -1; background: radial-gradient(rgba(0,70,90,0.28) 1.4px, transparent 1.8px) 0 0 / 7px 7px, repeating-conic-gradient(from 0deg at 50% 55%, #7fd6e3 0 7deg, #3fb2c6 7deg 14deg);
                clip-path: polygon(0 0, 100% 0, 100% calc(86% - 6px), 0 calc(100% - 6px)); }
  .cloud { position: absolute; width: 74px; height: auto; z-index: 0; pointer-events: none; }
  .cloud.c1 { right: 4px; top: 6px; transform: rotate(8deg) scale(.8); }
  .cloud.c2 { left: 2px; bottom: 8px; transform: scale(.9); }
  .logo { margin: 0; font-family: var(--title); font-weight: 400; line-height: 1.05; text-transform: uppercase; font-size: 66px; letter-spacing: 1px;
          background: linear-gradient(180deg, #ff9a86 0 42%, #ff4a3c 42% 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
          -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill;
          filter: drop-shadow(1px 1px 0 var(--ink)) drop-shadow(1px 1px 0 var(--ink)) drop-shadow(1px 1px 0 var(--ink)) drop-shadow(1px 1px 0 var(--ink)) drop-shadow(1px 1px 0 var(--ink)) drop-shadow(1px 1px 0 var(--ink)); }
  .logo.wtitle { font-size: 34px; letter-spacing: 1px; -webkit-text-stroke: 3px var(--ink); }

  .tag { margin: 0; background: var(--yellow); color: var(--ink); font-family: var(--title); font-size: 17px;
         text-transform: uppercase; letter-spacing: .5px; padding: 5px 14px 4px; border: 3px solid var(--edge);
         box-shadow: 4px 4px 0 var(--edge); transform: rotate(-2deg); order: -1; }
  .lbl { align-self: stretch; text-align: left; font-size: 16px; margin-bottom: -6px; text-transform: uppercase; letter-spacing: .5px; }
  .row { display: flex; gap: 10px; align-self: stretch; }
  input { font: inherit; font-size: 18px; color: var(--edge); background: #fff; border: 3px solid var(--edge); border-radius: 6px;
          border-radius: 0; padding: 9px 12px; box-shadow: inset 4px 4px 0 rgba(0,0,0,0.1); outline: none; min-width: 0; }
  input:focus { box-shadow: 0 0 0 3px var(--yellow); }
  #name { align-self: stretch; }
  #code { flex: 1; text-transform: uppercase; text-align: center; letter-spacing: 6px; font-family: var(--title); font-size: 24px; padding: 6px 8px; }
  .btn { font-family: var(--title); font-size: 22px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink); background: var(--yellow);
         border: 3px solid var(--edge); border-radius: 6px; padding: 8px 20px 6px; cursor: pointer;
         box-shadow: 4px 4px 0 var(--edge); transition: transform .06s, box-shadow .06s; transform: skewX(-8deg);
         -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
  .btn:hover { transform: skewX(-8deg) translate(-1px, -1px); box-shadow: 6px 6px 0 var(--edge); }
  .btn:active { transform: skewX(-8deg) translate(4px, 4px); box-shadow: 1px 1px 0 var(--edge); }
  .btn:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .btn-big { align-self: stretch; font-size: 26px; white-space: nowrap; }
  #again { position: absolute; z-index: 5; font-size: 28px; padding: 10px 34px 8px;
           left: 0; right: 0; margin: 0 auto; width: max-content; bottom: max(7%, env(safe-area-inset-bottom, 0px));
           animation: softIn .3s ease-out both; }
  .btn.busy { cursor: progress; filter: saturate(.75); }
  .btn.busy, .btn:disabled { transform: skewX(-8deg); box-shadow: 4px 4px 0 var(--edge); }
  /* ---------- Menu : écran titre façon arcade ----------
     logo dans une explosion BD en haut, bande de Kaboom sur le sable (dessinés sur la scène), formulaire compact en bas */
  #lobby .panel.title { width: min(100%, 640px); padding: 0; gap: 0; margin: 0 auto; align-self: stretch; filter: none; justify-content: flex-start; }
  #lobby .panel.title::before, #lobby .panel.title::after { display: none; }
  #lobby .title .hdr { margin: clamp(6px, 2.5vh, 30px) auto 0; padding: clamp(26px, 6.5vh, 54px) clamp(64px, 10vw, 120px) clamp(30px, 7.5vh, 60px);
                       align-self: center; filter: drop-shadow(5px 6px 0 rgba(6, 30, 40, .45)); }
  #lobby .title .hdr::before { inset: -7px; clip-path: polygon(50% 0%, 57.5% 13%, 68% 6%, 71% 19%, 86% 14%, 81.5% 29%, 96% 32%, 87% 44%, 99% 54%, 85.5% 61%, 92% 75%, 76.5% 74%, 74% 90%, 61% 81%, 50% 96%, 39% 81%, 26% 90%, 23.5% 74%, 8% 75%, 14.5% 61%, 1% 54%, 13% 44%, 4% 32%, 18.5% 29%, 14% 14%, 29% 19%, 32% 6%, 42.5% 13%); background: var(--ink); }
  /* explosion rouge plus grande, décalée, derrière la jaune : profondeur et punch */
  #lobby .title .burst2 { position: absolute; inset: -2% -4% -9%; z-index: -3; pointer-events: none; transform: rotate(8deg); }
  #lobby .title .burst2::before, #lobby .title .burst2::after { content: ""; position: absolute; clip-path: polygon(50% 0%, 57.5% 13%, 68% 6%, 71% 19%, 86% 14%, 81.5% 29%, 96% 32%, 87% 44%, 99% 54%, 85.5% 61%, 92% 75%, 76.5% 74%, 74% 90%, 61% 81%, 50% 96%, 39% 81%, 26% 90%, 23.5% 74%, 8% 75%, 14.5% 61%, 1% 54%, 13% 44%, 4% 32%, 18.5% 29%, 14% 14%, 29% 19%, 32% 6%, 42.5% 13%); }
  #lobby .title .burst2::before { inset: -7px; background: var(--ink); }
  #lobby .title .burst2::after { inset: 0; background: #e8302a; }
  @keyframes burstPulse { 0%, 100% { scale: 1; } 50% { scale: 1.045; } }
  #lobby .title .hdr::after { inset: 0; clip-path: polygon(50% 0%, 57.5% 13%, 68% 6%, 71% 19%, 86% 14%, 81.5% 29%, 96% 32%, 87% 44%, 99% 54%, 85.5% 61%, 92% 75%, 76.5% 74%, 74% 90%, 61% 81%, 50% 96%, 39% 81%, 26% 90%, 23.5% 74%, 8% 75%, 14.5% 61%, 1% 54%, 13% 44%, 4% 32%, 18.5% 29%, 14% 14%, 29% 19%, 32% 6%, 42.5% 13%);
                              background:
                                radial-gradient(rgba(140, 50, 0, .22) 1.8px, transparent 2.2px) 0 0 / 10px 10px,        /* trame de points BD, discrète */
                                radial-gradient(ellipse 46% 40% at 50% 52%, #1b93a8 0 70%, transparent 71%),             /* cœur bleu-vert (la mer) */
                                radial-gradient(ellipse 70% 62% at 50% 52%, #ffe45a 0 55%, #ffc52e 100%); }
  /* titre façon couverture de comics : lettres bâton penchées, remplissage en bandes jaune → rouge,
     gros contour noir, relief 3D, chaque lettre légèrement de travers, arrivée en « smash » */
  #lobby .title .logo { display: flex; align-items: flex-end; font-family: 'Bangers', var(--title); font-size: clamp(54px, 17vh, 112px);
                        letter-spacing: 0; line-height: .92; background: none; color: inherit; -webkit-text-stroke: 0;
                        transform: rotate(-4deg) skewX(-6deg);
                        filter: drop-shadow(1px 1px 0 #8a1508) drop-shadow(1px 1px 0 #8a1508) drop-shadow(1px 1px 0 #8a1508) drop-shadow(1px 1px 0 #8a1508)
                                drop-shadow(1px 1px 0 #8a1508) drop-shadow(1.5px 1.5px 0 var(--ink)) drop-shadow(1.5px 1.5px 0 var(--ink));
                        animation: smash .5s cubic-bezier(.2, 1.4, .4, 1) .12s both; }
  #lobby .title .logo span { display: inline-block; padding: 0 .03em;
                             background: linear-gradient(176deg, #fffbe6 0 24%, #ffe14a 24% 47%, #ffa21c 47% 69%, #f0412a 69% 100%);
                             -webkit-background-clip: text; background-clip: text; color: transparent;
                             -webkit-text-stroke: clamp(4px, 1.25vh, 7px) var(--ink); paint-order: stroke fill; }
  #lobby .title .logo span:nth-child(1) { transform: rotate(-7deg) translateY(5%) scale(1.14); }
  #lobby .title .logo span:nth-child(2) { transform: rotate(3deg) translateY(-3%); }
  #lobby .title .logo span:nth-child(3) { transform: rotate(-2deg) translateY(2%); }
  #lobby .title .logo span:nth-child(4) { transform: rotate(4deg) translateY(-5%); }
  #lobby .title .logo span:nth-child(5) { transform: rotate(-3deg) translateY(1%); }
  #lobby .title .logo span:nth-child(6) { transform: rotate(6deg) translateY(-2%) scale(1.14); }
  #lobby .title .hdr { animation: stamp .42s cubic-bezier(.2, 1.5, .4, 1) both; }
  /* devise : petit bandeau posé sous l'explosion, qui ne la chevauche que d'un cheveu */
  #lobby .title .tag { order: 0; align-self: center; margin-top: clamp(-14px, -2.5vh, -8px); position: relative; z-index: 2;
                       background: var(--red); color: #fff; font-family: 'Bangers', var(--title); letter-spacing: 1.5px;
                       font-size: clamp(14px, 4.2vh, 22px); padding: 3px 16px 1px; transform: rotate(-2.5deg) skewX(-6deg);
                       -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; box-shadow: 4px 4px 0 var(--ink); border-color: var(--ink);
                       animation: smash .4s cubic-bezier(.2, 1.4, .4, 1) .45s both; }
  #lobby .formbox { margin: auto auto clamp(8px, 3vh, 26px); align-self: center; width: min(calc(100% - 132px), 580px);   /* laisse la place au bouton du son */
                    display: grid; grid-template-columns: 1fr auto; gap: clamp(6px, 1.6vh, 10px) 10px; align-items: center;
                    padding: clamp(8px, 2vh, 14px) clamp(10px, 2vh, 16px); border: 3px solid var(--edge);
                    background: radial-gradient(rgba(240, 120, 40, .3) 1.4px, transparent 1.8px) 0 0 / 8px 8px, #ffe9b8; box-shadow: 4px 4px 0 var(--shadow); }
  #lobby .formbox .lbl, #lobby .formbox .ou { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #lobby .formbox #name { grid-column: 1; }
  #lobby .formbox .btn-big { grid-column: 2; align-self: stretch; font-size: clamp(16px, 4.6vh, 22px); padding: 6px 16px 4px; }
  #lobby .formbox .row { grid-column: 1 / 3; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  #lobby .formbox .opt, #lobby .formbox .note, #lobby .formbox #msg { grid-column: 1 / 3; margin: 0; }
  #lobby .formbox #msg:empty { display: none; }
  /* ---------- Salle d'attente : même habillage comics que le menu ---------- */
  #wait .panel { filter: drop-shadow(6px 6px 0 var(--ink)); }
  #wait .cloud { display: none; }
  #wait .hdr::after { background: radial-gradient(rgba(80, 0, 0, .22) 1.6px, transparent 2px) 0 0 / 8px 8px, var(--red); }
  #wait .logo.wtitle { font-family: 'Bangers', var(--title); font-size: clamp(30px, 9vh, 44px); letter-spacing: 1.5px;
                       background: linear-gradient(176deg, #ffffff 0 50%, #ffe14a 50% 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
                       -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; transform: rotate(-2deg) skewX(-6deg);
                       filter: drop-shadow(1px 1px 0 #6a0f06) drop-shadow(1px 1px 0 #6a0f06) drop-shadow(1px 1px 0 #6a0f06) drop-shadow(1.5px 1.5px 0 var(--ink)) drop-shadow(1.5px 1.5px 0 var(--ink)); }
  #wait .lbl { font-family: 'Bangers', var(--title); font-size: 17px; letter-spacing: 1px; }
  #wait .code-big { font-family: 'Bangers', var(--title); letter-spacing: 12px; color: var(--ink);
                    background: radial-gradient(rgba(240, 120, 40, .22) 1.4px, transparent 1.8px) 0 0 / 7px 7px, #fff; }
  #waitList li { font-family: 'Bangers', var(--title); font-size: 20px; letter-spacing: .8px; border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); transform: skewX(-4deg); }
  #waitList .who { font-family: var(--title); letter-spacing: 0; }
  #waitList .dot { background-image: radial-gradient(circle at 32% 30%, rgba(255,255,255,.85) 0 18%, transparent 22%); }
  #wait .note { font-family: 'Bangers', var(--title); font-size: 16px; letter-spacing: .8px; opacity: .85; }
  /* « Comment jouer » : calque qui capte le tap, bouton en bas ; bouton « ? » du menu */
  #howto { position: fixed; inset: 0; z-index: 9; display: flex; align-items: flex-end; justify-content: center; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); cursor: pointer; }
  #howto[hidden] { display: none; }
  #howtoGo { align-self: flex-end; width: auto; font-family: 'Bangers', var(--title); font-size: 26px; letter-spacing: 1.5px; padding: 6px 30px 4px; animation: smash .45s cubic-bezier(.2, 1.4, .4, 1) .55s both; }
  body.howto #lobby { visibility: hidden; }
  body.howto #helpBtn, body.ingame #helpBtn { display: none; }
  #helpBtn { position: fixed; z-index: 20; right: max(12px, env(safe-area-inset-right, 0px)); top: max(12px, env(safe-area-inset-top, 0px));
             width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--edge); background: var(--yellow); box-shadow: 3px 3px 0 var(--ink);
             font-family: 'Bangers', var(--title); font-size: 26px; line-height: 1; color: var(--ink); padding: 2px 0 0; cursor: pointer; }
  #helpBtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  #sndBtn { position: fixed; z-index: 20; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
            width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--edge); background: #ffe9b8; box-shadow: 3px 3px 0 var(--shadow);
            display: grid; place-items: center; padding: 0; cursor: pointer; touch-action: manipulation; }
  #sndBtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
  #sndBtn .x { display: none; } #sndBtn.off .x { display: inline; } #sndBtn.off .w1, #sndBtn.off .w2, #sndBtn.off .note, #sndBtn.nomus .note { display: none; }
  .btn-red { background: var(--red); color: #fff; -webkit-text-stroke: 1.5px var(--ink); }
  .ou { font-size: 15px; opacity: .55; margin: -4px 0; }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 15px; cursor: pointer; text-align: left; align-self: stretch; }
  .opt input { width: 20px; height: 20px; padding: 0; accent-color: var(--red); }
  .note { margin: 4px 0 0; font-size: 14px; line-height: 1.35; opacity: .8; }
  /* message d'erreur ou d'attente : bulle de dialogue */
  #msg { position: relative; align-self: stretch; background: #fff; border: 3px solid var(--edge); border-radius: 18px;
         padding: 8px 12px; font-size: 15px; line-height: 1.35; margin-top: 8px; }
  #msg::before { content: ""; position: absolute; top: -14px; left: 28px; border: 7px solid transparent; border-bottom: 7px solid var(--edge); border-left-color: transparent; }
  #msg:empty { display: none; }

  /* tableau des scores : petite case de BD */
  /* tableau de la salle (en haut à gauche) : case de comics penchée, bandeau rouge, victoires en étoiles */
  #hud { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px));
         display: none; pointer-events: none; min-width: 170px; max-width: 290px; color: var(--ink);
         background: radial-gradient(rgba(240,120,40,0.26) 1.4px, transparent 1.7px) 0 0 / 7px 7px, #fff1cf;
         border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); transform: rotate(-1.2deg) skewX(-4deg); transform-origin: 0 0;
         font-family: 'Bangers', var(--title); font-size: 16px; letter-spacing: .6px; line-height: 1.25; padding: 0 0 5px; }
  #hud .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; padding: 3px 10px 1px;
               background: radial-gradient(rgba(80,0,0,.22) 1.4px, transparent 1.7px) 0 0 / 6px 6px, var(--red); border-bottom: 3px solid var(--ink);
               font-family: 'Bangers', var(--title); font-size: 19px; color: #fff; text-transform: uppercase; -webkit-text-stroke: 1.2px var(--ink); paint-order: stroke fill; }
  #hud .head small { font-size: 13px; color: var(--yellow); letter-spacing: 1px; }
  #hud .r { display: flex; align-items: center; gap: 7px; padding: 1px 10px; }
  #hud .r.me { background: rgba(255,217,59,.55); }
  #hud .dot { display: inline-block; flex: none; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ink);
              background-image: radial-gradient(circle at 32% 30%, rgba(255,255,255,.85) 0 18%, transparent 22%); }
  #hud .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .stars { flex: none; display: flex; gap: 1px; }
  #hud .stars i { width: 11px; height: 11px; display: inline-block; background: rgba(11,12,15,.18);
                  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  #hud .stars i.on { background: #ffb21c; }
  #hud .out .nm { text-decoration: line-through; opacity: .5; }
  #hud .out .dot { opacity: .5; }
  #hud .ko { flex: none; font-size: 11px; color: #fff; background: var(--red); border: 1.5px solid var(--ink); padding: 0 4px; transform: rotate(-4deg); }
  #hud .sub { flex: none; opacity: .5; font-size: 11px; font-family: var(--title); letter-spacing: 0; }
  canvas { display: none; width: 100%; height: 100%; touch-action: none; }
  #game, #sea { animation: sceneIn .4s ease-out both; }
  @keyframes sceneIn { from { opacity: 0 } to { opacity: 1 } }
  #sea { position: fixed; left: 0; top: 0; z-index: -1; pointer-events: none; transform-origin: 0 0; }
  /* salle d'attente : même habillage que le menu */
  #wait { position: absolute; inset: 0; z-index: 6; display: flex; overflow-y: auto;
          padding: 16px max(16px, env(safe-area-inset-left, 0px)) 16px max(16px, env(safe-area-inset-right, 0px)); }
  #wait[hidden] { display: none; }
  .code-big { flex: 1; font-family: var(--title); font-size: 44px; letter-spacing: 8px; text-align: center; line-height: 1;
              background: #fff; border: 3px solid var(--edge); border-radius: 6px; padding: 10px 6px 6px; -webkit-user-select: all; user-select: all; }
  #waitList { list-style: none; margin: 0; padding: 0; align-self: stretch; display: flex; flex-direction: column; gap: 6px; min-height: 162px; align-content: start; }
  #waitList li { display: flex; align-items: center; gap: 10px; background: #fff; border: 3px solid var(--edge); border-radius: 6px; box-shadow: 3px 3px 0 var(--edge); padding: 7px 10px; font-size: 17px;
                 }
  #waitList li.new { animation: rise .35s cubic-bezier(.2,1.5,.4,1) both; }
  #waitList .dot { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--ink); flex: none; }
  #waitList .who { margin-left: auto; font-size: 13px; opacity: .6; }
  #startBtn[hidden], #waitMsg[hidden] { display: none; }

<script>
const PREFIX = 'cercles-p2p-';

// Terrain logique commun à tous les joueurs (mis à l'échelle à l'écran)
const WW = 800, WH = 600;
const SPEED = 330;        // unités/s
const RADIUS = 30;
const COIN_R = 10;
const PICK_DIST = RADIUS + COIN_R + 4;
const SEND_RATE = 20;     // envois/s
const MAX_COINS = 3;
const SPAWN_MS = 1200;
const RECAP_DELAY = 1400;  // on laisse finir l'animation du dernier K.O. avant le récapitulatif
const RESET_MS = 6500 + RECAP_DELAY;     // pause entre deux manches (récapitulatif des scores)
const MATCH_WINS = 5;      // manches à remporter pour gagner la partie
const MATCH_RESET_MS = 5500 + RECAP_DELAY;  // planche finale avant la fête du champion
const PARTY_BOMB_CD = 600;     // pendant le défi final, on bombarde plus vite
const COUNTDOWN_MS = 3000;     // compte à rebours (mèche de bombe) avant chaque manche
const PARTY_MS = 10000;        // le champion doit tenir 10 secondes
let goAt = 0;                  // heure locale du « GO ! » de la manche en cours
const ROUND_MS = 60000;        // au bout d'une minute de manche : HURRY UP ! (explosions plus grandes)
const HURRY_BLAST = 1.6;       // rayon des explosions en mode HURRY UP
const STUN_MS = 2000;          // défi final : un attaquant touché par la bombe du champion est assommé
const FLING_MS = 1150;         // K.O. : le joueur rebondit puis est projeté hors de l'écran avant le message « éliminé »
const GHOST_DELAY = 3000;      // éliminé : on revient en fantôme au bout de 3 s
const GHOST_CD = 4000;         // un fantôme ne lance qu'une bombe à glu toutes les 4 s
const GLUE_R = 72;             // flaque de glu : rayon
const GLUE_MS = 6000;          // elle reste 6 s au sol
const GLUE_SLOW = 0.45;        // dans la glu, on avance à 45 % de sa vitesse
const flyers = [];             // joueurs éliminés projetés hors de l'écran (décor)
const glueTrails = [];         // empreintes gluantes laissées en sortant d'une flaque (décor local)
const glueZones = [];          // { x, y, r, t0 }
const GHOST_SPEED = 0.5;       // un fantôme se déplace deux fois moins vite
const GHOST_SIZE = 0.85;       // un peu plus petit qu'un joueur, translucide et sous les joueurs
let hurryShown = -1;           // manche dont l'annonce HURRY UP a déjà été jouée
let hurryAt = 0;
function hurryOn(now = performance.now()) {
  return game.started && !waiting && !game.party && !game.winner && !game.endResult && goAt !== Infinity && now - goAt >= ROUND_MS;
}
function ghostAllowed() { return game.started && !waiting && !game.winner && !game.party && !game.endResult; }
let waiting = true;             // salle d'attente : la partie n'a pas encore été lancée par l'hôte
let partyEndsAt = 0;           // heure locale de la fin du défi du champion

// Serveurs STUN + TURN (relais Metered, compte gratuit 20 Go/mois).
// Ces identifiants sont visibles dans la page : à remplacer/révoquer depuis le tableau de bord Metered si besoin.
const TURN_USER = '3f9c265b1090a6b1c89bffb9';
const TURN_PASS = 'Lnqvzt2drtBgAm8q';
const PEER_OPTS = {
  config: {
    iceServers: [
      { urls: 'stun:stun.relay.metered.ca:80' },
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'turn:standard.relay.metered.ca:80', username: TURN_USER, credential: TURN_PASS },
      { urls: 'turn:standard.relay.metered.ca:80?transport=tcp', username: TURN_USER, credential: TURN_PASS },
      { urls: 'turn:standard.relay.metered.ca:443', username: TURN_USER, credential: TURN_PASS },
      { urls: 'turns:standard.relay.metered.ca:443?transport=tcp', username: TURN_USER, credential: TURN_PASS }
    ]
  }
};

const $ = id => document.getElementById(id);
const msg = t => {
  const el = $('msg');
  if (el.textContent === t) return;
  el.textContent = t;
  if (el.classList) { el.classList.remove('pop'); void el.offsetWidth; if (t) el.classList.add('pop'); }
};

// Bouton « en cours » : le texte change sur place, sans bulle de message,
// pour que le menu ne bouge pas juste avant l'arrivée en salle d'attente
function busy(id, label) {
  const b = $(id); if (!b) return;
  if (label) {
    if (!b.dataset.label) { b.dataset.label = b.textContent; b.style.width = b.offsetWidth + 'px'; }
    b.textContent = label; b.disabled = true; b.classList.add('busy');
  } else if (b.dataset.label) {
    b.textContent = b.dataset.label; delete b.dataset.label; b.style.width = ''; b.disabled = false; b.classList.remove('busy');
  }
}
function idle() { busy('create'); busy('join'); }
{ const o = $('howto'), hb = $('helpBtn');
  if (o && o.addEventListener) o.addEventListener('click', e => { e.stopPropagation(); closeHowto(); });
  if (hb && hb.addEventListener) hb.addEventListener('click', e => { e.stopPropagation(); if (!menuOn) startMenuScene(); openHowto(); });
  if (window.addEventListener) window.addEventListener('keydown', e => { if (howto.open && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); closeHowto(); } }, true);
}
let peer = null;
let myId = null;
let hostId = null;
let amHost = false;
let hostLeft = false;
let roomCode = '';
const conns = {};        // peerId -> DataConnection
const players = {};      // peerId -> { x, y, tx, ty, color, name }
const info = {};         // peerId -> { rtt, type }
const me = { x: WW / 2, y: WH / 2, color: randomColor(), name: '' };
const keys = {};

// État de la partie : l'hôte est l'arbitre, les autres reçoivent une copie
let game = { coins: [], scores: {}, winner: null, matchWinner: null, colors: {}, feed: [], round: 0, roundKills: {}, party: false, endResult: null, started: false, pickup: null, grab: null };
let resetAt = 0;        // heure locale de la prochaine manche (pour le compte à rebours)
let recapT0 = 0, winSeenAt = 0;        // moment où le récapitulatif est apparu
let feedSeq = 0;
const feedSeen = {};      // id d'élimination -> moment où on l'a reçue (pour l'afficher quelques secondes)
let coinSeq = 0;

// Couleurs bien distinctes, attribuées par l'hôte dans l'ordre d'arrivée (on évite le jaune des pièces)
const PALETTE = [
  'hsl(210 85% 60%)', 'hsl(355 80% 60%)', 'hsl(140 65% 50%)', 'hsl(280 70% 65%)',
  'hsl(25 90% 58%)', 'hsl(175 70% 45%)', 'hsl(325 75% 62%)', 'hsl(95 60% 50%)'
];

function assignColor(id) {
  if (!amHost || game.colors[id] != null) return;
  const used = new Set(Object.values(game.colors));
  let idx = 0;
  while (used.has(idx) && idx < PALETTE.length) idx++;
  game.colors[id] = idx;
}

function colorOf(id) {
  const idx = game.colors[id];
  if (idx != null) return PALETTE[idx % PALETTE.length];
  return id === myId ? me.color : ((players[id] && players[id].color) || '#888');
}

function randomColor() { return `hsl(${Math.floor(Math.random() * 360)} 80% 60%)`; }
function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  return Array.from({ length: 4 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}

/* ---------- Lobby ---------- */

try { const n = localStorage.getItem('cercles-name'); if (n) $('name').value = n; } catch (e) {}

function readName() {
  let n = $('name').value.trim().slice(0, 12);
  if (!n) n = 'Joueur' + Math.floor(10 + Math.random() * 90);
  me.name = n;
  try { localStorage.setItem('cercles-name', n); } catch (e) {}
  goLandscape();
}

// Sur Android : plein écran et écran bloqué en paysage (iPhone ne le permet pas : on affiche « Tourne ton téléphone »)
function goLandscape() {
  try {
    const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (!touch) return;
    const el = document.documentElement;
    const fs = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : null;
    const lock = () => { try { const p = screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'); if (p && p.catch) p.catch(() => {}); } catch (e) {} };
    if (fs && fs.then) fs.then(lock, () => {}); else lock();
  } catch (e) {}
}

$('create').onclick = () => { readName(); createRoom(); };
$('again').onclick = () => requestRematch();
$('startBtn').onclick = () => startMatch();
$('copyCode').onclick = () => {
  const code = $('waitCode').textContent, btn = $('copyCode');
  const done = () => { btn.textContent = 'Copié !'; setTimeout(() => { btn.textContent = 'Copier'; }, 1500); };
  try {
    navigator.clipboard.writeText(code).then(done, () => selectCode());
  } catch (e) { selectCode(); }
};
function selectCode() {   // si la copie est refusée, on sélectionne le code pour une copie manuelle
  try { const r = document.createRange(); r.selectNodeContents($('waitCode')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch (e) {}
}
$('join').onclick = () => { readName(); joinRoom($('code').value.trim().toUpperCase()); };
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('join').click(); });

let joinTimer = null;

// Si la connexion au serveur de mise en relation tombe (onglet en arrière-plan, veille), on la rétablit
function keepAlive(p) {
  p.on('disconnected', () => { try { p.reconnect(); } catch (e) {} });
}

function createRoom(attempt = 0) {
  msg('');
  busy('create', 'Création…'); busy('join', '…');
  const code = randomCode();
  peer = new Peer(PREFIX + code, PEER_OPTS);
  keepAlive(peer);
  peer.on('open', id => { myId = id; hostId = id; amHost = true; enterGame(code); });
  peer.on('error', err => {
    if (err.type === 'unavailable-id' && attempt < 5) { peer.destroy(); createRoom(attempt + 1); }
    else { idle(); msg('Erreur : ' + err.type); }
  });
  peer.on('connection', c => setupConn(c));
}

function joinRoom(code) {
  if (code.length !== 4) return msg('Le code fait 4 lettres.');
  clearTimeout(joinTimer);
  msg('');
  busy('join', '…'); busy('create', 'Connexion…');
  hostId = PREFIX + code;
  peer = new Peer(undefined, PEER_OPTS);
  keepAlive(peer);
  peer.on('open', id => {
    myId = id;
    const c = peer.connect(hostId, { reliable: true });
    joinTimer = setTimeout(() => { idle(); msg(
      'Connexion impossible entre vos réseaux. Réessaie, ou passez sur le même wifi.'
    ); }, 15000);
    c.on('open', () => { clearTimeout(joinTimer); enterGame(code); });
    setupConn(c);
  });
  peer.on('error', err => {
    clearTimeout(joinTimer);
    idle();
    msg(err.type === 'peer-unavailable'
      ? 'Salle introuvable. Vérifie le code.'
      : 'Erreur : ' + err.type);
  });
  peer.on('connection', c => setupConn(c));
}

/* ---------- Réseau (maillage : chacun connecté à chacun) ---------- */

function gameMsg() {
  return { t: 'game', coins: game.coins, scores: game.scores, winner: game.winner, matchWinner: game.matchWinner,
           colors: game.colors, feed: game.feed, round: game.round, roundKills: game.roundKills,
           party: game.party, endResult: game.endResult, started: game.started,
           pickup: game.pickup ? { id: game.pickup.id, kind: game.pickup.kind, x: game.pickup.x, y: game.pickup.y } : null,
           pickupLeft: game.pickup ? Math.max(0, pickupExpires - performance.now()) : 0, grab: game.grab || null,
           partyLeft: game.party && !game.endResult ? Math.max(0, partyEndsAt - performance.now()) : 0,
           resetIn: game.winner ? Math.max(0, resetAt - performance.now()) : 0 };
}
function broadcastGame() { broadcast(gameMsg()); }

function setupConn(conn) {
  conn.on('open', () => {
    conns[conn.peer] = conn;
    // L'hôte indique au nouvel arrivant qui est déjà là, pour qu'il se connecte à eux
    if (amHost) {
      conn.send({ t: 'peers', list: Object.keys(conns).filter(id => id !== conn.peer) });
    }
    conn.send(stateMsg());
    if (amHost) { assignColor(conn.peer); broadcastGame(); }
  });

  conn.on('data', data => {
    if (!data || typeof data !== 'object') return;
    switch (data.t) {
      case 'peers':
        if (conn.peer !== hostId || !Array.isArray(data.list)) return;
        data.list.forEach(id => {
          if (typeof id === 'string' && id !== myId && !conns[id]) {
            setupConn(peer.connect(id, { reliable: true }));
          }
        });
        break;
      case 'state': {
        if (String(conn.peer).startsWith('bot')) return;
        const isNew = !players[conn.peer];
        applyRemoteState(conn.peer, data, false);
        if (isNew && amHost) trimBots();        // un vrai joueur arrive : il prend la place d'un bot
        break;
      }
      case 'bots': {
        // l'hôte envoie l'état de ses bots à tout le monde
        if (conn.peer !== hostId || !Array.isArray(data.list)) return;
        const seen = new Set();
        for (const bd of data.list.slice(0, MIN_PLAYERS)) {
          if (!bd || typeof bd.id !== 'string' || !/^bot\d+$/.test(bd.id)) continue;
          seen.add(bd.id);
          applyRemoteState(bd.id, bd, true);
        }
        for (const id in players) if (players[id].bot && !seen.has(id)) delete players[id];
        break;
      }
      case 'bomb': {
        const v = [data.sx, data.sy, data.tx, data.ty].map(Number);
        if (v.every(isFinite)) {
          // une bombe de bot n'est acceptée que si c'est l'hôte qui l'envoie
          const owner = conn.peer === hostId && typeof data.owner === 'string' && /^bot\d+$/.test(data.owner) ? data.owner : conn.peer;
          const t = aimFrom(v[0], v[1], v[2], v[3], rangeOf(players[owner]) * 1.05);   // on refuse les lancers au-delà de la portée (bonus compris)
          launchBomb(owner, v[0], v[1], t.x, t.y, !!data.mega, !!data.hr, !!data.gl);
        }
        break;
      }
      case 'ping':
        conn.send({ t: 'pong', ts: data.ts });
        break;
      case 'pong':
        info[conn.peer] = Object.assign(info[conn.peer] || {}, { rtt: Math.round(performance.now() - data.ts) });
        break;
      case 'game':
        if (conn.peer !== hostId) return;
        {
          const prevWinner = game.winner, prevParty = game.party, prevPickup = game.pickup;
          game = {
            coins: Array.isArray(data.coins) ? data.coins : [],
            scores: data.scores && typeof data.scores === 'object' ? data.scores : {},
            winner: data.winner || null,
            colors: data.colors && typeof data.colors === 'object' ? data.colors : {},
            feed: Array.isArray(data.feed) ? data.feed.slice(-4) : [],
            matchWinner: typeof data.matchWinner === 'string' ? data.matchWinner : null,
            round: Number(data.round) || 0,
            roundKills: data.roundKills && typeof data.roundKills === 'object' ? data.roundKills : {},
            party: !!data.party,
            endResult: data.endResult === 'champion' || data.endResult === 'fallen' ? data.endResult : null,
            started: !!data.started,
            pickup: null, grab: null
          };
          {
            const pk = data.pickup, now = performance.now();
            if (pk && BONUS_KINDS.includes(pk.kind) && isFinite(pk.x) && isFinite(pk.y)) {
              const same = prevPickup && prevPickup.id === pk.id;
              game.pickup = { id: Number(pk.id) || 0, kind: pk.kind, x: Math.max(0, Math.min(WW, +pk.x)), y: Math.max(0, Math.min(WH, +pk.y)), t0: same ? prevPickup.t0 : now };
              pickupExpires = now + Math.min(PICK_LIFE, Math.max(0, Number(data.pickupLeft) || 0));
            }
            const gr = data.grab;
            if (lastGrabN === null) lastGrabN = gr ? Number(gr.n) || 0 : -1;   // on vient d'arriver : l'ancien ramassage ne compte pas
            if (gr && typeof gr.by === 'string' && BONUS_KINDS.includes(gr.kind)) { game.grab = { n: Number(gr.n) || 0, by: gr.by, kind: gr.kind }; onGrab(game.grab); }
          }
          if (game.winner) resetAt = performance.now() + Math.min(15000, Math.max(0, Number(data.resetIn) || 0));
          if (game.party && !game.endResult) partyEndsAt = performance.now() + Math.min(20000, Math.max(0, Number(data.partyLeft) || 0));
          // nouvelle manche, début ou fin de la fête : tout le monde repart à pleine vie
          if ((prevWinner && !game.winner) || (prevParty && !game.party)) newRound();
          if (game.started && waiting) { waiting = false; newRound(); }   // l'hôte vient de lancer (ou la partie était déjà lancée)
        }
        break;
      case 'grab':
        if (amHost) hostGrab(conn.peer, Number(data.id));
        break;
      case 'rematch':
        // un joueur appuie sur « Rejouer » pendant la fête : l'hôte relance une partie
        if (amHost && game.endResult) startNewMatch();
        break;
      case 'kill':
        // envoyé par la victime à l'hôte, qui tient le compte des éliminations
        if (amHost && typeof data.killer === 'string') addKill(data.killer, conn.peer);
        break;
    }
  });

  const drop = () => {
    delete conns[conn.peer];
    delete players[conn.peer];
    delete info[conn.peer];
    if (amHost) { delete game.scores[conn.peer]; delete game.colors[conn.peer]; broadcastGame(); }
    else if (conn.peer === hostId) {
      hostLeft = true;
      for (const id in players) if (players[id].bot) delete players[id];
    }
  };
  conn.on('close', drop);
  conn.on('error', drop);
}

function applyRemoteState(id, data, isBot) {
  const x = Number(data.x), y = Number(data.y);
  if (!isFinite(x) || !isFinite(y)) return;
  const name = String(data.name || '').slice(0, 12);
  const color = String(data.color || '').slice(0, 30);
  let hp = Number(data.hp);
  hp = isFinite(hp) ? Math.max(0, Math.min(HP_MAX, hp)) : HP_MAX;
  const dead = !!data.dead;
  const p = players[id];
  const now = performance.now();
  if (!p) { players[id] = { x, y, tx: x, ty: y, color, name, hp, dead, hitAt: 0, bot: isBot }; applyBonusState(players[id], data, now); return; }
  applyBonusState(p, data, now);
  if (hp > p.hp && !dead && !p.dead) p.healAt = now;   // potion
  if (hp < p.hp) {                       // il vient d'être touché : retour visuel pour tout le monde
    p.hitAt = now;
    addHitBubble(p, Math.round(p.hp - hp), dead);
  }
  if (dead && !p.dead) { shockwaves.push({ x: p.x, y: p.y, color: colorOf(id), t0: now, range: RADIUS * 3 }); addFlyer(p, colorOf(id), now); }
  if (!dead && p.dead) { p.x = x; p.y = y; }   // nouvelle manche : pas de glissement depuis l'ancien endroit
  p.tx = x; p.ty = y; p.color = color; p.name = name; p.hp = hp; p.dead = dead;
  p.ghost = dead && !!data.gh;
}

function broadcast(data) {
  for (const id in conns) if (conns[id].open) conns[id].send(data);
}

// Type de connexion réellement utilisé : directe ou via le relais TURN
async function connType(conn) {
  try {
    const pc = conn.peerConnection;
    if (!pc) return '?';
    const stats = await pc.getStats();
    let pair = null;
    stats.forEach(r => { if (r.type === 'transport' && r.selectedCandidatePairId) pair = stats.get(r.selectedCandidatePairId); });
    if (!pair) stats.forEach(r => { if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') pair = r; });
    if (!pair) return '?';
    const l = stats.get(pair.localCandidateId), r = stats.get(pair.remoteCandidateId);
    return (l && l.candidateType === 'relay') || (r && r.candidateType === 'relay') ? 'relais' : 'directe';
  } catch (e) { return '?'; }
}

function refreshTypes() {
  for (const id in conns) {
    connType(conns[id]).then(t => {
      if (conns[id]) info[id] = Object.assign(info[id] || {}, { type: t });
    });
  }
}

/* ---------- Règles du jeu (exécutées par l'hôte uniquement) ---------- */

function spawnCoin() {
  if (!amHost || game.winner || game.coins.length >= MAX_COINS) return;
  game.coins.push({
    id: ++coinSeq,
    x: 40 + Math.random() * (WW - 80),
    y: 40 + Math.random() * (WH - 80)
  });
  broadcastGame();
}

function scheduleReset() {
  const endOfMatch = !!game.matchWinner;
  const delay = endOfMatch ? MATCH_RESET_MS : RESET_MS;
  resetAt = performance.now() + delay;
  setTimeout(() => {
    game.winner = null;
    game.coins = [];
    game.feed = [];
    game.roundKills = {};
    if (endOfMatch) { game.party = true; game.endResult = null; }   // défi final : le champion doit tenir 10 s
    newRound();
    if (endOfMatch) partyEndsAt = goAt + PARTY_MS;
    broadcastGame();
  }, delay);
}

// Salle d'attente : liste des joueurs, bouton de lancement pour l'hôte
function updateWaitRoom() {
  const box = $('wait');
  if (!box) return;
  if (!waiting) { box.hidden = true; return; }
  box.hidden = false;
  const humans = [{ id: myId, name: me.name, me: true }].concat(
    Object.keys(players).filter(id => !players[id].bot).map(id => ({ id, name: players[id].name || '…' })));
  const list = $('waitList');
  const key = humans.map(h => h.id + h.name).join('|');
  if (list.dataset.key !== key) {          // on ne reconstruit que si la liste change (pas de clignotement)
    list.dataset.key = key;
    const seen = new Set((list.dataset.ids || '').split('|'));
    list.dataset.ids = humans.map(h => h.id).join('|');
    list.replaceChildren();
    for (const h of humans) {
      const li = document.createElement('li');
      if (list.dataset.init && !seen.has(h.id)) li.className = 'new';   // seul l'arrivant s'anime, les autres ne clignotent pas
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = colorOf(h.id);
      const nm = document.createElement('span');
      nm.textContent = h.name;
      li.appendChild(dot); li.appendChild(nm);
      const tags = [];
      if (h.id === hostId) tags.push('hôte');
      if (h.me) tags.push('toi');
      if (tags.length) { const w = document.createElement('span'); w.className = 'who'; w.textContent = tags.join(' · '); li.appendChild(w); }
      list.appendChild(li);
    }
    list.dataset.init = '1';
  }
  const nb = Math.max(0, MIN_PLAYERS - humans.length);
  $('waitBots').textContent = nb ? (nb > 1 ? nb + ' bots compléteront la partie.' : '1 bot complétera la partie.') : 'Assez de joueurs, pas de bots.';
  $('startBtn').hidden = !amHost;
  $('waitMsg').hidden = amHost;
  if (hostLeft) { $('waitMsg').hidden = false; $('waitMsg').textContent = "L'hôte a quitté la salle. Reviens au menu pour en créer une."; }
}

// « Rejouer » : nouvelle partie, compteurs à zéro
function startMatch() {
  if (!amHost || game.started) return;
  game.started = true;
  waiting = false;
  $('wait').hidden = true;
  newRound();          // complète avec des bots puis lance le compte à rebours
  broadcastGame();
}

function startNewMatch() {
  if (!amHost) return;
  game.party = false;
  game.endResult = null;
  game.matchWinner = null;
  game.winner = null;
  game.scores = {};
  game.round = 0;
  game.roundKills = {};
  game.feed = [];
  newRound();
  broadcastGame();
}

// Fin du défi : 'champion' (il a tenu 10 s) ou 'fallen' (il est tombé)
function endParty(result) {
  if (!amHost || game.endResult) return;
  game.endResult = result;
  broadcastGame();
}

function requestRematch() {
  if (amHost) startNewMatch();
  else if (conns[hostId] && conns[hostId].open) conns[hostId].send({ t: 'rematch' });
}

// L'hôte crédite une élimination ; la victime ne peut pas se l'attribuer
function addKill(killer, victim) {
  if (!amHost || game.winner) return;
  if (killer !== myId && !players[killer]) return;
  game.feed.push({ id: ++feedSeq, k: killer, v: victim });
  if (game.feed.length > 4) game.feed.shift();
  if (killer !== victim) game.roundKills[killer] = (game.roundKills[killer] || 0) + 1;   // se faire sauter ne rapporte rien
  broadcastGame();
}

function reportKill(killer, victim) {
  if (amHost) addKill(killer, victim);
  else if (conns[hostId] && conns[hostId].open) conns[hostId].send({ t: 'kill', killer });
}

// Début de manche : on repart à pleine vie (les bots aussi, chez l'hôte)
function newRound() {
  bombs.length = 0;
  glueZones.length = 0; glueTrails.length = 0; flyers.length = 0;
  grabAsked = 0;
  if (amHost) { game.pickup = null; schedulePickup(performance.now() + COUNTDOWN_MS); }
  goAt = performance.now() + COUNTDOWN_MS;   // compte à rebours avant de pouvoir jouer
  respawn(me); sendState();
  if (amHost) {
    trimBots();
    fillBots();
    for (const id in players) if (players[id].bot) { respawn(players[id]); players[id].tx = players[id].x; players[id].ty = players[id].y; }
    sendBots();
  }
}

function hostTick() {
  if (!amHost || game.winner || !game.started) return;
  if (game.party) {
    // défi final : le champion tombe -> raté ; il tient jusqu'au bout -> grand vainqueur
    if (game.endResult) return;
    const ch = champion();
    if (!ch || ch.dead) endParty('fallen');
    else if (partyEndsAt && performance.now() >= partyEndsAt) endParty('champion');
    return;
  }
  if (performance.now() < goAt) return;
  pickupTick();
  // Dernier survivant : dès qu'il reste au plus un joueur en vie (sur au moins deux), la manche s'arrête
  const ids = [myId].concat(Object.keys(players));
  if (ids.length >= 2) {
    const alive = ids.filter(id => id === myId ? !me.dead : !players[id].dead);
    if (alive.length <= 1) {
      const w = alive[0] || 'none';                 // 'none' : les derniers sont tombés en même temps
      game.winner = w;
      game.pickup = null;
      game.round = (game.round || 0) + 1;
      if (w !== 'none') {
        game.scores[w] = (game.scores[w] || 0) + 1;
        if (game.scores[w] >= MATCH_WINS) game.matchWinner = w;   // 5 manches : partie gagnée
      }
      scheduleReset();
      broadcastGame();
      return;
    }
  }
}

/* ---------- Jeu ---------- */

const GROUND_SH = '#693e19';   // ombre au sol : brun chaud sur le sable
const canvas = $('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1, scale = 1, ox = 0, oy = 0;
let portrait = false, viewW = 800, camX = 0, camT = 0;
const PORTRAIT_VIEW = 500;   // en portrait, largeur de terrain visible (unités) : le reste défile

// Caméra (portrait) : suit le joueur en douceur, sans sortir du terrain
function updateCamera(now) {
  const dt = Math.min(0.05, Math.max(0, (now - (camT || now)) / 1000)); camT = now;
  if (!portrait || viewW >= WW) { camX = 0; ox = (W - WW * scale) / 2; return; }
  const ch = game.party && !game.endResult ? champion() : null;
  const focus = !me.dead ? me : (ch || null);
  if (focus) {
    const target = Math.max(0, Math.min(WW - viewW, focus.x - viewW / 2));
    camX += (target - camX) * Math.min(1, dt * 7);
  }
  ox = -camX * scale;
}

// Joueurs hors de l'écran (portrait) : petite flèche à leur couleur sur le bord
function drawOffscreen(now) {
  if (!portrait || viewW >= WW) return;
  const list = Object.keys(players).filter(id => !players[id].dead).map(id => [players[id], colorOf(id)]);
  for (const [p, col] of list) {
    const sx = ox + p.x * scale;
    if (sx >= -RADIUS * scale * 0.5 && sx <= W + RADIUS * scale * 0.5) continue;
    const left = sx < 0, ex = left ? 14 : W - 14;
    const ey = Math.max(oy + 12, Math.min(oy + WH * scale - 12, oy + p.y * scale));
    ctx.save(); ctx.translate(ex, ey); if (!left) ctx.scale(-1, 1);
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, -11); ctx.lineTo(8, 11); ctx.closePath();
    ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = col; ctx.fill();
    ctx.restore();
  }
}

// mer derrière le jeu : redessinée seulement si la taille change ; en portrait elle suit la caméra
let _seaX = null;
function syncSea() {
  const el = $('sea'); if (!el || !W) return;
  const extra = portrait && viewW < WW ? Math.ceil((WW - viewW) * scale) : 0;
  ISL.renderSea(el, W, H, dpr, scale, oy, extra);
  const x = extra ? Math.round(ox) : 0;
  if (x !== _seaX) { _seaX = x; el.style.transform = 'translateX(' + x + 'px)'; }
}
function placeSoundBtn() {
  const b = $('sndBtn'); if (!b || !b.style) return;
  if (!document.body || !document.body.classList || !document.body.classList.contains('ingame')) { b.style.top = b.style.right = b.style.bottom = ''; return; }
  const tb = timerBox();
  b.style.bottom = 'auto'; b.style.top = Math.round(tb.y + tb.h / 2 - 21) + 'px'; b.style.right = Math.round(W - tb.x + 14) + 'px';
}
let safeR = 0, safeT = 0;   // encoche / coins arrondis du téléphone (en px)
// Disposition du terrain pour une taille d'écran donnée (partagée par resize() et le préchauffage du décor)
function calcLayout(W, H) {
  const portrait = H > W * 1.1;
  if (portrait) {
    // Téléphone en hauteur : on agrandit le terrain et la caméra suit le joueur de gauche à droite
    const top = 100, bottom = 165;                   // place pour le tableau des scores et le joystick
    const scale = Math.max(W / WW, Math.min(W / PORTRAIT_VIEW, (H - top - bottom) / WH));
    return { portrait, scale, viewW: Math.min(WW, W / scale), oy: top + Math.max(0, (H - top - bottom - WH * scale) / 2) };
  }
  // on garde de la place autour du terrain pour le rebord de l'île et la falaise (en bas)
  const mx = ISL.SIDE, mt = ISL.TOP, mb = ISL.BOTTOM;
  const scale = Math.min(W / (WW + 2 * mx), H / (WH + mt + mb));
  return { portrait, scale, viewW: WW, oy: (H - (WH + mt + mb) * scale) / 2 + mt * scale };
}
function resize() {
  dpr = window.devicePixelRatio || 1;
  { const sp = $('safeProbe'); if (sp) { safeR = sp.offsetWidth || 0; safeT = sp.offsetHeight || 0; } }
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const L = calcLayout(W, H);
  portrait = L.portrait; scale = L.scale; viewW = L.viewW; oy = L.oy;
  if (portrait) {
    camX = Math.max(0, Math.min(WW - viewW, (me.x || WW / 2) - viewW / 2));
    ox = -camX * scale;
  } else {
    camX = 0;
    ox = (W - WW * scale) / 2;
  }
  if (typeof layoutJoystick === 'function') { layoutJoystick(); layoutAim(); placeSoundBtn(); }
}
// Préchauffage : pendant que le joueur tape son pseudo, on dessine déjà l'île et la mer
// (sinon la première image de la partie gèle l'écran pendant le dessin du décor).
let _warmT = 0;
function prewarmScene() {
  clearTimeout(_warmT);
  _warmT = setTimeout(() => {
    try {
      const w = window.innerWidth, h = window.innerHeight, d = window.devicePixelRatio || 1;
      if (!w || !h) return;
      const L = calcLayout(w, h);
      ISL.prewarm(L.scale * d);
      ISL.renderSea($('sea'), w, h, d, L.scale, L.oy, L.portrait && L.viewW < WW ? Math.ceil((WW - L.viewW) * L.scale) : 0);
    } catch (e) { console.warn('préchauffage', e); }
  }, 350);
}
window.addEventListener('resize', resize);
window.addEventListener('resize', () => { if (!document.body.classList.contains('ingame')) prewarmScene(); });
window.addEventListener('load', prewarmScene);

function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
}

window.addEventListener('keydown', e => {
  if (e.key.startsWith('Arrow')) e.preventDefault();

/* ---------- Bombes et points de vie ----------
   On touche le terrain (ou on clique) : une bombe part vers ce point et explose à l'arrivée.
   Comme pour les déplacements, chaque joueur reste maître de son propre état :
   le lanceur envoie la bombe à tout le monde, et chacun vérifie lui-même s'il est dans l'explosion,
   retire ses points de vie et les transmet aux autres. */
const HP_MAX = 100;
const BOMB_DMG = 25;          // 4 bombes pour éliminer un joueur
const BOMB_RANGE = 300;       // distance maximale du lancer (unités du terrain)
const BLAST_R = 70;           // rayon de l'explosion
const BOMB_FLIGHT = 550;      // durée du vol (ms)
const BOMB_CD = 1500;         // recharge entre deux bombes (ms)
const EXPLO_COLOR = 'hsl(28 95% 58%)';

me.hp = HP_MAX; me.dead = false; me.respawnAt = 0; me.hitAt = 0;
let bombReadyAt = 0, bombCdTotal = BOMB_CD;
const facing = { x: 1, y: 0 };   // dernière direction de déplacement
const bombs = [];                // bombes en vol { owner, sx, sy, tx, ty, t0 }
const shockwaves = [];           // explosions { x, y, color, t0, range }
const popups = [];               // dégâts flottants { x, y, text, t0 }

function stateMsg() {
  return Object.assign({ t: 'state', x: me.x, y: me.y, color: me.color, name: me.name, hp: me.hp, dead: me.dead, gh: me.ghost ? 1 : 0 }, bonusState(me));
}
function sendState() { broadcast(stateMsg()); }

// Zone jouable du personnage : seuls ses pieds comptent. Ils restent sur le sable,
// sans mordre sur le rebord de mousse ; la tête et le corps peuvent passer devant la bordure.
const FOOT_IN = 10;                                        // marge du bord de mousse (unités terrain)
const FOOT_X = 0.7 * RADIUS, FOOT_TOP = 0.78 * RADIUS, FOOT_BOT = 1.12 * RADIUS;   // emprise des pieds autour du centre
function clampBody(x, y) {
  return { x: Math.max(FOOT_IN + FOOT_X, Math.min(WW - FOOT_IN - FOOT_X, x)),
           y: Math.max(FOOT_IN - FOOT_TOP, Math.min(WH - FOOT_IN - FOOT_BOT, y)) };
}
function clampField(x, y) {
  return { x: Math.max(RADIUS, Math.min(WW - RADIUS, x)), y: Math.max(RADIUS, Math.min(WH - RADIUS, y)) };
}

// Point d'arrivée : là où on a visé, ramené à la portée maximale
function aimFrom(sx, sy, tx, ty, range) {
  const R = range || BOMB_RANGE;
  let dx = tx - sx, dy = ty - sy;
  const d = Math.hypot(dx, dy);
  if (d > R) { dx *= R / d; dy *= R / d; }
  return clampField(sx + dx, sy + dy);
}

function launchBomb(owner, sx, sy, tx, ty, mega, hurry, glue) {
  SFX.throw(sx, sy, glue);

  bombs.push({ owner, sx, sy, tx, ty, t0: performance.now(), mega: !!mega, hurry: !!hurry, r, dmg: mega ? MEGA_DMG : BOMB_DMG });

function throwBomb(tx, ty) {
  const now = performance.now();
  if (!myId || me.stunUntil > performance.now() || (me.dead && !me.ghost) || waiting || game.winner || game.endResult || now < goAt || now < bombReadyAt) return false;

  bombCdTotal = me.ghost ? GHOST_CD : (game.party ? PARTY_BOMB_CD : BOMB_CD);
  bombReadyAt = now + bombCdTotal;

}

// Ennemi vivant le plus proche (pour la touche Espace et les bots)
function nearestEnemy(x, y, selfId) {
  let best = null, bestD = Infinity;
  const cands = [];
  if (selfId !== myId && !me.dead) cands.push(me);
  for (const id in players) if (id !== selfId && !players[id].dead) cands.push(players[id]);
  for (const c of cands) {
    const d = Math.hypot(c.x - x, c.y - y);
    if (d < bestD) { bestD = d; best = c; }
  }
  return best ? { x: best.x, y: best.y, d: bestD } : null;
}

// Champion de la partie (pendant la fête) : ce que tout le monde vise
function champion() {

  return game.matchWinner === myId ? me : players[game.matchWinner] || null;
}
// Pendant la fête, seul le champion peut être touché

function throwAtNearest() {
  const ch = champion();
  if (ch && game.matchWinner !== myId) { throwBomb(ch.x, ch.y); return; }
  const t = nearestEnemy(me.x, me.y, myId);
  const rg = rangeOf(me);
  if (t && t.d <= rg * 1.2 && t.d > BLAST_R + RADIUS + 10) throwBomb(t.x, t.y);
  else throwBomb(me.x + facing.x * rg * 0.6, me.y + facing.y * rg * 0.6);
}

function damage(p, color, owner, victimId, dmg = BOMB_DMG) {
  if (p.dead || game.winner || game.endResult || !canBeHit(victimId)) return;
  const now = performance.now();
  if (p.shieldUntil > now) {             // le bouclier encaisse la bombe et éclate
    p.shieldUntil = 0; p.pops = (p.pops || 0) + 1;
    addFxBubble(p, 'pop');
    return;
  }
  p.hp = Math.max(0, (p.hp == null ? HP_MAX : p.hp) - dmg);
  p.hitAt = now;
  addHitBubble(p, dmg, p.hp <= 0);
  if (p.hp <= 0) {
    p.dead = true;
    p.deadAt = now;
    shockwaves.push({ x: p.x, y: p.y, color, t0: now, range: RADIUS * 3 });
    addFlyer(p, color, now);
    if (owner) reportKill(owner, victimId);

function explode(b) {
  const now = performance.now();
  SFX.boom(b.tx, b.ty, b.mega ? 1.5 : (b.hurry ? 1.25 : 1), b.glue);
  if (b.glue) {          // bombe à glu : une flaque gluante, aucun dégât

    shockwaves.push({ x: b.tx, y: b.ty, color: '#7be04a', t0: now, range: b.r * 0.8 });

    return;
  }
  shockwaves.push({ x: b.tx, y: b.ty, color: EXPLO_COLOR, t0: now, range: b.r || BLAST_R });
  if (b.mega) shake(5, 200);
  const reach = (b.r || BLAST_R) + RADIUS;   // touché si le rond chevauche l'explosion
  if (game.party && b.owner === game.matchWinner) {   // bombe du champion : elle assomme les attaquants à portée

  {

    const note = (p, id) => {
      if (!p || p.dead || id === b.owner || !canBeHit(id) || p.shieldUntil > nowF) return;
      if (Math.hypot(p.x - b.tx, p.y - b.ty) > reach) return;
      if ((p.hp == null ? HP_MAX : p.hp) - dmg <= 0) return;          // coup fatal : c'est la ligne K.O. qui s'affichera
      addHitFeed(b.owner, id, dmg);

const WAVE_MS = 260;

      ctx.beginPath();

      ctx.fill();

      ctx.fill();
      ctx.globalAlpha = 0.65 * fade;
      ctx.lineWidth = 14 * fade + 2;
      ctx.strokeStyle = s.color;
      ctx.stroke();
      ctx.globalAlpha = 0.95 * fade;
      ctx.lineWidth = 3.5 * fade + 1;

      ctx.lineWidth = 2;
      ctx.strokeStyle = s.color;
      ctx.stroke();
    }

    const gx = b.sx + (b.tx - b.sx) * p, gy = b.sy + (b.ty - b.sy) * p;
    const h = 4 * 80 * p * (1 - p);   // hauteur de la cloche
    // ombre au sol, plus petite quand la bombe est haute
    ctx.save();
    ctx.globalAlpha = 0.35 - h * 0.0012;
    ctx.beginPath();
    ctx.ellipse(gx + 2, gy, BOMB_R * (1 - h * 0.003), BOMB_R * 0.5 * (1 - h * 0.003), 0, 0, Math.PI * 2);
    ctx.fillStyle = GROUND_SH;
    ctx.fill();
    ctx.restore();
    // la bombe tourne sur elle-même dans le sens du lancer, et sa mèche se consume
    const spin = (b.tx >= b.sx ? 1 : -1) * p * 4.2;
    if (b.glue) drawGlueBall(gx, gy - h, now, spin); else drawBombSprite(gx, gy - h, b.mega ? BOMB_R * 1.35 : BOMB_R, -0.9 + spin, p);
  }
}

// Bombe cartoon : sphère noire au contour épais, reflets fixes (la lumière vient d'en haut à gauche),
// goulot, mèche en corde qui raccourcit, étincelle en étoile rouge et jaune qui grésille.
const BOMB_R = 18;   // bombes des joueurs un peu plus grosses
function drawBombSprite(x, y, r, angle, burnt) {
  const ink = '#0b0c0f';
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // corps
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#23252b';
  ctx.fill();
  ctx.lineWidth = r * 0.17;
  ctx.strokeStyle = ink;
  ctx.stroke();
  // ombre propre en bas à droite, pour le volume
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r - r * 0.08, 0, Math.PI * 2);
  ctx.clip();
  ctx.beginPath();
  ctx.arc(x + r * 0.35, y + r * 0.35, r * 0.95, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();
  ctx.restore();
  // reflets
  ctx.save();
  ctx.translate(x - r * 0.42, y - r * 0.4);
  ctx.rotate(-0.75);
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.26, r * 0.13, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(x - r * 0.62, y - r * 0.02, r * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fill();

  // goulot, mèche et étincelle tournent avec la bombe
  ctx.translate(x, y);
  ctx.rotate(angle);
  // goulot
  const nw = r * 0.62, n0 = r * 0.72, n1 = r * 1.12;
  ctx.beginPath();
  ctx.moveTo(n0, -nw / 2);
  ctx.lineTo(n1, -nw / 2);
  ctx.quadraticCurveTo(n1 + r * 0.08, 0, n1, nw / 2);
  ctx.lineTo(n0, nw / 2);
  ctx.closePath();
  ctx.fillStyle = '#2c2f37';
  ctx.fill();
  ctx.lineWidth = r * 0.14;
  ctx.strokeStyle = ink;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(n0 + r * 0.1, -nw / 2 + r * 0.1);
  ctx.lineTo(n1 - r * 0.08, -nw / 2 + r * 0.1);
  ctx.lineWidth = r * 0.07;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.stroke();

  // mèche : courbe qui part du goulot, de plus en plus courte
  const L = r * 1.5 * (1 - 0.65 * burnt);
  const sx = n1 + r * 0.02, sy = 0;
  const cx = sx + L * 0.55, cy = -L * 0.55;
  const ex = sx + L * 0.95, ey = -L * 0.2;
  const fuse = () => { ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, ex, ey); };
  fuse(); ctx.lineWidth = r * 0.34; ctx.strokeStyle = ink; ctx.stroke();
  fuse(); ctx.lineWidth = r * 0.2; ctx.strokeStyle = '#d8b98a'; ctx.stroke();
  fuse(); ctx.setLineDash([r * 0.12, r * 0.16]); ctx.lineWidth = r * 0.2; ctx.lineCap = 'butt';
  ctx.strokeStyle = '#9c7a4c'; ctx.stroke();
  ctx.setLineDash([]); ctx.lineCap = 'round';

  // étincelle en étoile au bout de la mèche
  ctx.translate(ex, ey);
  ctx.rotate(-angle + Math.random() * 0.6);
  const k = 0.85 + Math.random() * 0.3;
  const star = (outer, inner, n) => {
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const rr = i % 2 ? inner : outer * (i % 4 === 0 ? 1 : 0.8);
      const a = (i / (n * 2)) * Math.PI * 2;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
  };
  star(r * 0.62 * k, r * 0.28 * k, 8);
  ctx.fillStyle = '#e8462c';
  ctx.fill();
  ctx.lineWidth = r * 0.09;
  ctx.strokeStyle = ink;
  ctx.stroke();
  star(r * 0.34 * k, r * 0.15 * k, 8);
  ctx.fillStyle = '#ffd23f';
  ctx.fill();
  ctx.restore();
}

/* ---------- Bonus ----------
   Un seul bonus à la fois sur le terrain. L'hôte le fait apparaître et décide qui l'a ramassé
   (le premier qui le lui signale) ; le joueur applique ensuite l'effet à lui-même. */
const PICK_R = 30;                       // rayon du jeton sur le terrain
const PICK_LIFE = 8000;                  // il disparaît au bout de 8 s
const PICK_EVERY = [8000, 12000];        // délai avant le suivant
const HEAL_AMT = 25, SHIELD_MS = 8000, SPEED_MS = 5000, SPEED_MUL = 1.4;
const RANGE_MS = 8000, RANGE_MUL = 1.6;   // bonus longue portée : les bombes vont 60 % plus loin pendant 8 s
function rangeOf(p) { return BOMB_RANGE * (p && p.rangeUntil > performance.now() ? RANGE_MUL : 1); }
const MEGA_DMG = 40, MEGA_BLAST = 1.5;
const BONUS_KINDS = ['heal', 'shield', 'mega', 'speed', 'range'];
const BONUS_WEIGHTS = { heal: 4, shield: 2, mega: 2, speed: 2, range: 2 };   // la potion sort plus souvent
const BONUS_COL = { heal: '#ff3b5c', shield: '#2f8cff', mega: '#ff7a00', speed: '#ffd400', range: '#a05cff' };
const BONUS_DARK = { heal: '#c2183a', shield: '#1659c9', mega: '#d14d00', speed: '#e0a800', range: '#6b2fc9' };
const BONUS_FX = {
  heal:   { word: 'GULP!', sub: '+' + HEAL_AMT, fill: '#b6ff9c', txt: '#22c24a' },
  shield: { word: 'BLING!', fill: '#d8f0ff', txt: '#2f8cff' },
  mega:   { word: 'MEGA!', fill: '#ffe14a', txt: '#ff6a00' },
  speed:  { word: 'ZOOM!', fill: '#fff59a', txt: '#ffb300' },
  range:  { word: 'TIR LONG!', sub: 'PORTÉE +', fill: '#ecdcff', txt: '#9b4dff' },
  pop:    { word: 'POP!', fill: '#ffffff', txt: '#59a8ff' }
};
let pickupExpires = 0;       // heure locale de disparition du bonus affiché
let nextPickupAt = Infinity; // (hôte) prochaine apparition
let pickSeq = 0, grabSeq = 0;
let lastGrabN = null;        // dernier ramassage déjà affiché
let grabAsked = 0;           // bonus déjà demandé à l'hôte (une seule demande par bonus)

function pickKind() {
  let tot = 0; for (const k of BONUS_KINDS) tot += BONUS_WEIGHTS[k];
  let r = Math.random() * tot;
  for (const k of BONUS_KINDS) { r -= BONUS_WEIGHTS[k]; if (r < 0) return k; }
  return 'heal';
}
function bonusAllowed() { return game.started && !waiting && !game.winner && !game.party && !game.endResult && performance.now() >= goAt; }
function schedulePickup(from) { nextPickupAt = from + PICK_EVERY[0] + Math.random() * (PICK_EVERY[1] - PICK_EVERY[0]); }

// Hôte : apparition / disparition
function pickupTick() {
  if (!amHost) return;
  const now = performance.now();
  if (game.pickup && (now >= pickupExpires || !bonusAllowed())) {
    game.pickup = null; schedulePickup(now); broadcastGame(); return;
  }
  if (!game.pickup && bonusAllowed() && now >= nextPickupAt) {
    const bodies = [me].concat(Object.values(players)).filter(p => !p.dead);
    let pos = null;
    for (let i = 0; i < 12; i++) {       // pas sous les pieds d'un joueur
      const c = { x: 70 + Math.random() * (WW - 140), y: 70 + Math.random() * (WH - 140) };
      pos = c;
      if (bodies.every(p => Math.hypot(p.x - c.x, p.y - c.y) > 110)) break;
    }
    game.pickup = { id: ++pickSeq, kind: pickKind(), x: Math.round(pos.x), y: Math.round(pos.y) };
    pickupExpires = now + PICK_LIFE;
    game.pickup.t0 = now;
    broadcastGame();
  }
}

function bodyOf(id) { return id === myId ? me : players[id]; }

// Hôte : quelqu'un touche le bonus
function hostGrab(id, pid) {
  if (!amHost || !game.pickup || (pid != null && pid !== game.pickup.id) || !bonusAllowed()) return;
  const p = bodyOf(id);
  if (!p || p.dead) return;
  if (Math.hypot(p.x - game.pickup.x, p.y - game.pickup.y) > RADIUS + PICK_R + 40) return;   // trop loin : refusé
  game.grab = { n: ++grabSeq, by: id, kind: game.pickup.kind };
  game.pickup = null;
  schedulePickup(performance.now());
  onGrab(game.grab);
  broadcastGame();
}

// Chez tout le monde : bulle de ramassage, et effet si c'est soi (ou un bot chez l'hôte)
function onGrab(gr) {
  if (!gr || gr.n === lastGrabN) return;
  lastGrabN = gr.n;
  const p = bodyOf(gr.by);
  if (!p) return;
  addFxBubble(p, gr.kind);
  if (gr.by === myId) { applyBonus(me, gr.kind); sendState(); }
  else if (amHost && p.bot) applyBonus(p, gr.kind);
}

function applyBonus(p, kind) {
  const now = performance.now();
  if (kind === 'heal') p.hp = Math.min(HP_MAX, (p.hp == null ? HP_MAX : p.hp) + HEAL_AMT);
  if (kind === 'shield') p.shieldUntil = now + SHIELD_MS;
  if (kind === 'mega') p.mega = true;
  if (kind === 'speed') p.speedUntil = now + SPEED_MS;
  if (kind === 'range') p.rangeUntil = now + RANGE_MS;
  p.healAt = kind === 'heal' ? now : p.healAt;
}
function clearBonus(p) { p.shieldUntil = 0; p.mega = false; p.speedUntil = 0; p.rangeUntil = 0; }
function speedMul(p) { if (p.stunUntil > performance.now()) return 0; return (p.speedUntil > performance.now() ? SPEED_MUL : 1) * glueMul(p); }
// Dans une flaque de glu, on avance au ralenti
function glueMul(p) {
  const now = performance.now();
  for (let i = glueZones.length - 1; i >= 0; i--) {
    const z = glueZones[i];
    if (now - z.t0 > GLUE_MS) { glueZones.splice(i, 1); continue; }
    if (Math.hypot(p.x - z.x, p.y - z.y) < z.r + RADIUS * 0.3) return GLUE_SLOW;
  }
  return 1;
}

// Chaque joueur vérifie s'il touche le bonus et le signale à l'hôte
function checkPickup() {
  const pk = game.pickup;
  if (!pk || me.dead || !bonusAllowed() || grabAsked === pk.id) return;
  if (Math.hypot(me.x - pk.x, me.y - pk.y) > RADIUS + PICK_R) return;
  grabAsked = pk.id;
  if (amHost) hostGrab(myId, pk.id);
  else if (conns[hostId] && conns[hostId].open) conns[hostId].send({ t: 'grab', id: pk.id });
}

// Effets transmis dans l'état de chaque joueur
function bonusState(p) {
  const now = performance.now();
  return { sh: Math.max(0, Math.round((p.shieldUntil || 0) - now)), mg: p.mega ? 1 : 0,
           sp: Math.max(0, Math.round((p.speedUntil || 0) - now)), rg: Math.max(0, Math.round((p.rangeUntil || 0) - now)), pop: p.pops || 0 };
}
function applyBonusState(p, data, now) {
  const sh = Math.min(SHIELD_MS, Math.max(0, Number(data.sh) || 0));
  const sp = Math.min(SPEED_MS, Math.max(0, Number(data.sp) || 0));
  p.shieldUntil = sh ? now + sh : 0;
  p.speedUntil = sp ? now + sp : 0;
  { const rg = Math.min(RANGE_MS, Math.max(0, Number(data.rg) || 0)); p.rangeUntil = rg ? now + rg : 0; }
  p.mega = !!data.mg;
  const pop = Number(data.pop) || 0;
  if (p.pops != null && pop > p.pops) addFxBubble(p, 'pop');    // son bouclier vient d'éclater
  p.pops = pop;
}

/* --- Dessin des bonus (icônes de la planche validée) --- */
let G = null;   // contexte de dessin des icônes (écran ou image en cache)
function bnStar(x, y, n, ro, ri, rot) {
  G.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = rot + i / (n * 2) * Math.PI * 2, r = i % 2 ? ri : ro; G.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  G.closePath();
}
function bnHalftone(x, y, r, color, step, dot) {
  G.save(); G.clip(); G.fillStyle = color;
  for (let i = -r; i <= r; i += step) for (let j = -r; j <= r; j += step) {
    const off = (Math.round((j + r) / step) % 2) * step / 2;
    const d = Math.hypot(i + off, j) / r;
    const k = dot * (0.45 + 0.75 * Math.max(0, (i + off + j) / (2 * r) + 0.5));
    G.beginPath(); G.arc(x + i + off, y + j, Math.max(0.6, k * (1.1 - d * 0.3)), 0, Math.PI * 2); G.fill();
  }
  G.restore();
}

function bnPotion(x, y, s) {
  G.save(); G.translate(x, y); G.scale(s, s);
  G.lineJoin = 'round';
  // fiole ronde : goulot droit + panse ronde, d'un seul contour
  const R = 17, cy = 4, nw = 6, yj = cy - Math.sqrt(R * R - nw * nw);
  const a0 = Math.atan2(yj - cy, -nw), a1 = Math.atan2(yj - cy, nw);
  const flask = () => { G.beginPath(); G.moveTo(-nw, -22); G.lineTo(-nw, yj); G.arc(0, cy, R, a0, a1, true); G.lineTo(nw, -22); G.closePath(); };
  flask(); G.fillStyle = '#cfeeff'; G.fill();
  // liquide rouge
  G.save(); flask(); G.clip();
  G.fillStyle = '#ff3b5c'; G.fillRect(-25, -3, 50, 30);
  G.fillStyle = '#ff8aa0'; G.fillRect(-25, -3, 50, 3);
  G.restore();
  flask(); G.lineWidth = 4.5; G.strokeStyle = INK; G.stroke();
  // bouchon
  G.fillStyle = '#b7793f'; G.beginPath(); G.roundRect(-8, -30, 16, 9, 3); G.fill(); G.lineWidth = 3.5; G.strokeStyle = INK; G.stroke();
  // reflet + croix de soin
  G.fillStyle = 'rgba(255,255,255,0.75)'; G.beginPath(); G.ellipse(-9, 4, 2.5, 6, -0.3, 0, Math.PI * 2); G.fill();
  G.fillStyle = '#fff'; G.fillRect(1, 3, 4, 12); G.fillRect(-3, 7, 12, 4);
  G.restore();
}
function bnShield(x, y, s) {
  G.save(); G.translate(x, y); G.scale(s, s);
  G.lineJoin = 'round';
  G.beginPath();
  G.moveTo(0, -24); G.lineTo(19, -16); G.lineTo(17, 4);
  G.quadraticCurveTo(13, 18, 0, 25); G.quadraticCurveTo(-13, 18, -17, 4); G.lineTo(-19, -16); G.closePath();
  G.fillStyle = '#2f8cff'; G.fill(); G.lineWidth = 4.5; G.strokeStyle = INK; G.stroke();
  // bande claire + étoile
  G.save(); G.clip();
  G.fillStyle = '#7fb6ff'; G.beginPath(); G.moveTo(-20, -25); G.lineTo(0, -25); G.lineTo(0, 26); G.lineTo(-20, 26); G.fill();
  G.restore();
  G.beginPath(); G.moveTo(0, -24); G.lineTo(19, -16); G.lineTo(17, 4); G.quadraticCurveTo(13, 18, 0, 25); G.quadraticCurveTo(-13, 18, -17, 4); G.lineTo(-19, -16); G.closePath();
  G.lineWidth = 4.5; G.stroke();
  bnStar(0, 0, 5, 9, 4, -Math.PI / 2); G.fillStyle = YELLOW; G.fill(); G.lineWidth = 2; G.stroke();
  G.restore();
}
function bnBombBody(x, y, r, band) {
  G.lineJoin = 'round';
  // mèche + étincelle
  G.beginPath(); G.moveTo(x + r * 0.55, y - r * 0.75); G.quadraticCurveTo(x + r * 1.0, y - r * 1.25, x + r * 1.25, y - r * 1.05);
  G.lineWidth = r * 0.3; G.strokeStyle = INK; G.stroke(); G.lineWidth = r * 0.16; G.strokeStyle = '#d8b98a'; G.stroke();
  bnStar(x + r * 1.28, y - r * 1.08, 8, r * 0.5, r * 0.22, 0); G.fillStyle = RED; G.fill(); G.lineWidth = 2; G.strokeStyle = INK; G.stroke();
  bnStar(x + r * 1.28, y - r * 1.08, 8, r * 0.26, r * 0.11, 0.2); G.fillStyle = YELLOW; G.fill();
  // goulot
  G.save(); G.translate(x, y); G.rotate(-0.85);
  G.fillStyle = '#2c2f37'; G.fillRect(r * 0.72, -r * 0.3, r * 0.4, r * 0.6); G.lineWidth = r * 0.13; G.strokeStyle = INK; G.strokeRect(r * 0.72, -r * 0.3, r * 0.4, r * 0.6);
  G.restore();
  // corps
  G.beginPath(); G.arc(x, y, r, 0, Math.PI * 2); G.fillStyle = '#23252b'; G.fill();
  if (band) {
    G.save(); G.beginPath(); G.arc(x, y, r, 0, Math.PI * 2); G.clip();
    G.fillStyle = RED; G.fillRect(x - r, y - r * 0.18, r * 2, r * 0.42);
    G.restore();
  }
  G.beginPath(); G.arc(x, y, r, 0, Math.PI * 2); G.lineWidth = r * 0.16; G.strokeStyle = INK; G.stroke();
  G.save(); G.translate(x - r * 0.42, y - r * 0.42); G.rotate(-0.75);
  G.beginPath(); G.ellipse(0, 0, r * 0.26, r * 0.13, 0, 0, Math.PI * 2); G.fillStyle = 'rgba(255,255,255,0.6)'; G.fill(); G.restore();
}
function bnMega(x, y, s) {
  G.save(); G.translate(x, y); G.scale(s, s);
  bnBombBody(-2, 4, 19, true);
  // « x2 » en pastille
  G.beginPath(); G.arc(-17, 16, 11, 0, Math.PI * 2); G.fillStyle = YELLOW; G.fill(); G.lineWidth = 2.5; G.strokeStyle = INK; G.stroke();
  G.textAlign = 'center'; G.textBaseline = 'middle'; G.font = '13px ' + TITLE_FONT; G.fillStyle = INK; G.fillText('XL', -17, 17);
  G.restore();
}
// Longue portée : cible rouge et blanche traversée par une flèche
function bnRange(x, y, s) {
  G.save(); G.translate(x, y); G.scale(s, s); G.lineJoin = 'round'; G.lineCap = 'round';
  [[22, RED], [15, '#ffffff'], [8, RED]].forEach(([r, c]) => { G.beginPath(); G.arc(4, 4, r, 0, Math.PI * 2); G.fillStyle = c; G.fill(); G.lineWidth = 3; G.strokeStyle = INK; G.stroke(); });
  G.beginPath(); G.moveTo(-24, -20); G.lineTo(4, 4); G.lineWidth = 7; G.strokeStyle = INK; G.stroke(); G.lineWidth = 3.5; G.strokeStyle = '#a05cff'; G.stroke();
  G.beginPath(); G.moveTo(-27, -23); G.lineTo(-17, -24); G.lineTo(-25, -14); G.closePath(); G.fillStyle = '#ffd93b'; G.fill(); G.lineWidth = 2.5; G.strokeStyle = INK; G.stroke();
  G.restore();
}
function bnBolt(x, y, s) {
  G.save(); G.translate(x, y); G.scale(s, s);
  G.lineJoin = 'round';
  G.beginPath();
  G.moveTo(6, -26); G.lineTo(-14, 3); G.lineTo(-1, 3); G.lineTo(-7, 26); G.lineTo(15, -6); G.lineTo(2, -6); G.lineTo(10, -26); G.closePath();
  G.fillStyle = '#ffd400'; G.fill(); G.lineWidth = 4.5; G.strokeStyle = INK; G.stroke();
  G.beginPath(); G.moveTo(5, -21); G.lineTo(-7, -1); G.lineWidth = 3; G.strokeStyle = '#fff3a6'; G.stroke();
  G.restore();
}

function bnIcon(x, y, kind, s) {
  if (kind === 'heal') bnPotion(x, y + 5 * s * 0.9, s * 0.9);
  if (kind === 'shield') bnShield(x, y, s);
  if (kind === 'mega') bnMega(x - 3 * s, y + 4 * s, s * 0.72);
  if (kind === 'speed') bnBolt(x, y, s);
  if (kind === 'range') bnRange(x, y, s);
}
// Bonus posé : juste l'icône, façon autocollant (liseré blanc épais), mise en cache
const tokenCache = {};
const ICON_S = 1.0, ICON_BOX = 70, TOK_PX = 2.4;   // icône dessinée dans une boîte de 70 unités
function tokenSprite(kind) {
  if (tokenCache[kind]) return tokenCache[kind];
  const size = Math.ceil(ICON_BOX * TOK_PX);
  const icon = document.createElement('canvas'); icon.width = icon.height = size;
  const prev = G; G = icon.getContext('2d');
  G.scale(TOK_PX, TOK_PX); G.translate(ICON_BOX / 2, ICON_BOX / 2);
  bnIcon(kind === 'mega' ? 2 : 0, 0, kind, kind === 'mega' ? ICON_S * 1.3 : ICON_S);   // la bombe est dessinée plus petite par défaut
  // silhouette blanche
  const sil = document.createElement('canvas'); sil.width = sil.height = size;
  const sg = sil.getContext('2d');
  sg.drawImage(icon, 0, 0); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = '#fff'; sg.fillRect(0, 0, size, size);
  const ink = document.createElement('canvas'); ink.width = ink.height = size;
  const ig = ink.getContext('2d');
  ig.drawImage(icon, 0, 0); ig.globalCompositeOperation = 'source-in'; ig.fillStyle = INK; ig.fillRect(0, 0, size, size);
  // assemblage : ombre dure, liseré blanc (silhouette décalée tout autour), icône
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d');
  const w = 4.5 * TOK_PX;
  for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; g.drawImage(ink, Math.cos(a) * w + 3.5 * TOK_PX, Math.sin(a) * w + 4 * TOK_PX); }

const PICK_DRAW = 0.95;   // taille de l'icône sur le terrain (1 = ~50 unités de haut)

// Bonus posé : apparition en « pop », flotte doucement, clignote les 2 dernières secondes
function drawPickup(now) {
  const pk = game.pickup;
  if (!pk) return;
  const t0 = pk.t0 || now, left = pickupExpires - now;
  if (left < 2000 && Math.floor(now / 120) % 2 === 0) return;
  const age = Math.max(0, now - t0);   // l'heure de l'image peut précéder l'apparition de quelques ms
  const pop = age < 160 ? age / 160 * 1.2 : (age < 280 ? 1.2 - 0.2 * (age - 160) / 120 : 1);
  const bob = Math.sin(now / 260) * 4;
  const k = PICK_DRAW * pop * (1 + Math.sin(now / 300) * 0.04);
  ctx.save();
  ctx.globalAlpha = 0.4 - bob * 0.02; ctx.fillStyle = GROUND_SH;
  ctx.beginPath(); ctx.ellipse(pk.x, pk.y + PICK_R + 2, Math.max(0.1, PICK_R * 0.7 * pop), Math.max(0.1, 5 * pop), 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  const sp = tokenSprite(pk.kind);
  const w = ICON_BOX * k;
  ctx.drawImage(sp.cv, pk.x - w / 2, pk.y - 4 + bob - w / 2, w, w);

}

// Bulle de bouclier autour du joueur

  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); bnHalftone(p.x, p.y, R, 'rgba(160,205,255,0.45)', 6, 1.3);

// Traînée de vitesse : fantômes tramés et traits jaunes derrière le joueur
function drawSpeedTrail(p, color, now) {
  p.trail = p.trail || [];
  if (!(p.speedUntil > now)) { p.trail.length = 0; return; }
  const tr = p.trail;
  if (!tr.length || now - tr[tr.length - 1].t > 30) tr.push({ x: p.x, y: p.y, t: now });
  while (tr.length && now - tr[0].t > 200) tr.shift();
  const old = tr[0];
  const dx = p.x - old.x, dy = p.y - old.y, d = Math.hypot(dx, dy);
  if (d < 8) return;
  const ux = dx / d, uy = dy / d;
  G = ctx; ctx.save();
  for (let i = 3; i >= 1; i--) {
    const gx = p.x - ux * i * 17, gy = p.y - uy * i * 17;
    ctx.beginPath(); ctx.arc(gx, gy, RADIUS - i * 2, 0, Math.PI * 2);
    ctx.globalAlpha = 0.9; bnHalftone(gx, gy, RADIUS, color, 6, 2.2 - i * 0.45);

  ctx.globalAlpha = 1; ctx.lineCap = 'round';
  for (const [o, len] of [[-15, 34], [0, 50], [15, 30]]) {

    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - ux * len, by - uy * len);
    ctx.lineWidth = 8; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 4; ctx.strokeStyle = '#ffd400'; ctx.stroke();
  }
  ctx.restore();
}

// Croix vertes qui montent après une potion

// Bonus actifs : petits modules accrochés en bas à droite du rond (le liseré coloré = temps restant)
const MOD_R = 12.5, MOD_ANG = [Math.PI / 4, Math.PI / 4 + 0.9, Math.PI / 4 - 0.9, Math.PI / 4 + 1.8];
function drawBadges(p, now) {
  const list = [];
  if (p.shieldUntil > now) list.push(['shield', (p.shieldUntil - now) / SHIELD_MS]);
  if (p.mega) list.push(['mega', 1]);
  if (p.speedUntil > now) list.push(['speed', (p.speedUntil - now) / SPEED_MS]);
  if (p.rangeUntil > now) list.push(['range', (p.rangeUntil - now) / RANGE_MS]);
  list.forEach(([kind, prog], i) => {
    const a = MOD_ANG[i], d = RADIUS + MOD_R + 2;   // juste à l'extérieur du bord
    const bx = p.x + Math.cos(a) * d, by = p.y + Math.sin(a) * d;

    ctx.beginPath(); ctx.moveTo(p.x + Math.cos(a) * (RADIUS - 3), p.y + Math.sin(a) * (RADIUS - 3)); ctx.lineTo(bx, by);
    ctx.lineWidth = 9; ctx.strokeStyle = INK; ctx.stroke();
    // ombre dure + module

    ctx.beginPath(); ctx.arc(bx, by, MOD_R + 1.5, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, MOD_R, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
    // liseré de couleur qui se vide avec le temps

    ctx.lineWidth = 3.4; ctx.strokeStyle = BONUS_COL[kind]; ctx.stroke();
    if (prog < 0.25 && Math.floor(now / 110) % 2 === 0) { ctx.beginPath(); ctx.arc(bx, by, MOD_R, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill(); }   // va s'arrêter

function drawPopups(now) {

function drawSplash(word, x, y, fs, top, bottom, lines) {

  const w = ctx.measureText(word).width;
